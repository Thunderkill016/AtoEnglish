# GitLab CI — self-hosted runner (shell, không Docker) = unlimited minutes
# Setup: bash scripts/setup-gitlab-full.sh

stages:
  - verify
  - build
  - e2e

default:
  tags:
    - atoenglish

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .npm/

lint-test:
  stage: verify
  script:
    - npm ci --legacy-peer-deps
    - npm run lint
    - npx tsc --noEmit
    - npm run test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  script:
    - npm ci --legacy-peer-deps
    - npm run build
  variables:
    UPSTASH_REDIS_REST_URL: "https://placeholder.upstash.io"
    UPSTASH_REDIS_REST_TOKEN: "placeholder"
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BEl62iUYgUivxIkv69yViEuiBIa40TAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    VAPID_PRIVATE_KEY: "placeholder-vapid-private-key"
    VAPID_SUBJECT: "mailto:build@atoenglish.vercel.app"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - package.json
        - package-lock.json

e2e:
  stage: e2e
  script:
    - npm ci --legacy-peer-deps
    - npx playwright install chromium --with-deps
    - npm run dev &
    - npx wait-on http://localhost:3000 --timeout 60000
    - npm run e2e
  variables:
    PLAYWRIGHT_BASE_URL: "http://localhost:3000"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"