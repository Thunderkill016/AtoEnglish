# Agent health — nhẹ, không npm ci (tiết kiệm ~5 phút/ngày)
# Daemon local đã chạy lint+test; job này chỉ cảnh báo backlog stalled.

name: Agent Health (Nightly)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Backlog stall check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count ready backlog tasks
        id: backlog
        run: |
          COUNT=$(grep -c '\*\*Status:\*\* `ready`' AGENT_BACKLOG.md 2>/dev/null || true)
          COUNT=${COUNT:-0}
          echo "ready_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "📋 Backlog ready tasks: $COUNT"

      - name: Open issue if backlog stalled (no commits 48h)
        if: steps.backlog.outputs.ready_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              per_page: 1,
            });
            const last = commits[0];
            const hours = (Date.now() - new Date(last.commit.author.date)) / 3600000;
            if (hours > 48) {
              const title = '🤖 Autopilot: backlog có task ready nhưng không commit 48h';
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'autopilot',
              });
              if (!issues.data.some(i => i.title === title)) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: `Có task \`ready\` trong AGENT_BACKLOG.md nhưng main không có commit mới trong ${Math.round(hours)}h.\n\nKiểm tra:\n- \`systemctl --user status atoenglish-autopilot.service\`\n- \`tail -f logs/agent/daemon.log\`\n- \`bash scripts/agent-orchestrator.sh\``,
                  labels: ['autopilot'],
                });
              }
            }