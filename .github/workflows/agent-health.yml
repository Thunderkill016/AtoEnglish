name: Agent Health (Nightly)

on:
  schedule:
    # 02:00 UTC daily = 09:00 VN — health check khi agent không chạy
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Nightly health + backlog reminder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint + test
        run: |
          npm run lint
          npm run test

      - name: Count ready backlog tasks
        id: backlog
        run: |
          COUNT=$(grep -c '\*\*Status:\*\* `ready`' AGENT_BACKLOG.md || echo 0)
          echo "ready_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "📋 Backlog ready tasks: $COUNT"

      - name: Open issue if backlog stalled (no commits 48h)
        if: steps.backlog.outputs.ready_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              per_page: 1,
            });
            const last = commits[0];
            const hours = (Date.now() - new Date(last.commit.author.date)) / 3600000;
            if (hours > 48) {
              const title = '🤖 Autopilot: backlog có task ready nhưng không commit 48h';
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'autopilot',
              });
              if (!issues.data.some(i => i.title === title)) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: `Có task \`ready\` trong AGENT_BACKLOG.md nhưng main không có commit mới trong ${Math.round(hours)}h.\n\nKiểm tra:\n- Cron agent trên máy dev: \`crontab -l\`\n- Logs: \`logs/agent/\`\n- Chạy thủ công: \`bash scripts/agent-orchestrator.sh\``,
                  labels: ['autopilot'],
                });
              }
            }