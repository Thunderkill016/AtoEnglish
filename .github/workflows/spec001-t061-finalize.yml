name: Spec 001 T061 Finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Finalize T061 records
        shell: python
        run: |
          from pathlib import Path

          tasks_path = Path("specs/001-private-natural-lesson-compiler/tasks.md")
          tasks = tasks_path.read_text()
          old_task = (
              "- [ ] T061 Implement one actual trusted transcript ingestion/reviewer flow and run\n"
              "  one controlled rights-reviewed source through it"
          )
          new_task = (
              "- [x] T061 Implement one actual trusted transcript ingestion/reviewer flow and run\n"
              "  one controlled rights-reviewed source through it; hosted migrations\n"
              "  `20260803023053`, `20260803023140`, and `20260803023221`, the\n"
              "  JWT-authenticated reviewer function, two distinct Auth identities, source\n"
              "  `1000496`, approved-adapter reload, tamper rejection, and cleanup are\n"
              "  recorded in `t061-trusted-transcript-ingestion-verification.md`"
          )
          if tasks.count(old_task) != 1:
              raise SystemExit("Expected one unchecked T061 block")
          tasks = tasks.replace(old_task, new_task, 1)

          old_checkpoint = (
              "**Checkpoint**: The code and migration contract are implemented and tested. No\n"
              "production adapter is approved, and the migration has not been applied hosted."
          )
          new_checkpoint = (
              "**Checkpoint**: The trusted registry, reviewer function, and approved adapter are\n"
              "implemented and verified on hosted Supabase with a controlled public-domain\n"
              "source. The public compiler/UI is not routed to the adapter, and T075 human\n"
              "lesson review is not claimed."
          )
          if tasks.count(old_checkpoint) != 1:
              raise SystemExit("Expected one Phase 5B checkpoint")
          tasks = tasks.replace(old_checkpoint, new_checkpoint, 1)

          old_t084 = (
              "- [x] T084 Resolve the production transcript policy decision by retaining the\n"
              "  explicit merge blocker until a trusted provenance adapter is implemented and\n"
              "  verified"
          )
          new_t084 = (
              "- [x] T084 Resolve the production transcript policy decision by retaining the\n"
              "  explicit merge blocker; T061 now verifies a trusted adapter and reviewer flow,\n"
              "  but public routing, live Gemini, persisted browser evidence, and human review\n"
              "  remain required before merge or deployment"
          )
          if old_t084 in tasks:
              tasks = tasks.replace(old_t084, new_t084, 1)

          status_marker = "Trusted transcript flow:"
          if status_marker not in tasks:
              needle = "Hosted provenance/RPC:  PASS; migrations applied and verified\n"
              replacement = (
                  needle
                  + "Trusted transcript flow: PASS; hosted reviewer + approved adapter\n"
              )
              if needle in tasks:
                  tasks = tasks.replace(needle, replacement, 1)
          tasks_path.write_text(tasks)

          decision_path = Path(
              "specs/001-private-natural-lesson-compiler/production-transcript-decision.md"
          )
          decision = decision_path.read_text()
          start = decision.find("## Current implementation gap")
          if start < 0:
              raise SystemExit("Decision current-state section not found")
          tail = "\n".join([
              "## Current implementation state — 2026-08-03 T061 follow-up",
              "",
              "The earlier implementation-gap section is superseded by the hosted T061",
              "evidence. The project now has:",
              "",
              "- a hosted `real_talk_transcript_sources` provenance registry;",
              "- authenticated read-only client access and no direct client write grants;",
              "- a JWT-authenticated submit/reviewer Edge Function that derives identities",
              "  from Supabase Auth and computes the cue digest server-side;",
              "- independent reviewer authorization through server-written `app_metadata`;",
              "- immutable `human_verified` records;",
              "- the approved `supabase-reviewed-transcript-v1` adapter;",
              "- hosted evidence using controlled public-domain source `1000496`;",
              "- generated hosted types, policy tests, adapter tests, and signed-session",
              "  integration evidence.",
              "",
              "Detailed evidence is recorded in",
              "`t061-trusted-transcript-ingestion-verification.md`.",
              "",
              "The controlled integration used a dedicated reviewer test identity. This proves",
              "the authorization and provenance state transition, but it does not claim the",
              "human pedagogical/source-language review required by T075.",
              "",
              "## Remaining production blockers",
              "",
              "The merge blocker remains, but its reason has narrowed:",
              "",
              "1. the public private-lesson compiler and UI are still wired to the",
              "   production-blocked experimental YouTube path rather than the reviewed",
              "   registry adapter;",
              "2. T082 live Gemini verification is blocked by the missing GitHub Actions",
              "   secret;",
              "3. T074 persisted authenticated desktop/mobile browser verification is open;",
              "4. T075 human source-language, timing, situation, Vietnamese-guidance, and",
              "   transfer-coherence review is open;",
              "5. owner acceptance T088 is open;",
              "6. publication remains outside spec 001.",
              "",
              "Therefore no automatic public-YouTube transcript mode is approved, no fallback",
              "to unofficial caption acquisition is permitted, and the PR remains",
              "**DO NOT MERGE / DO NOT DEPLOY**.",
              "",
          ])
          decision_path.write_text(decision[:start] + tail)

          convergence_path = Path(
              "specs/001-private-natural-lesson-compiler/convergence-review.md"
          )
          convergence = convergence_path.read_text()
          marker = "## 2026-08-03 T061 trusted transcript follow-up"
          if marker not in convergence:
              convergence += "\n" + "\n".join([
                  marker,
                  "",
                  "T061 now has hosted evidence for a trusted registry, server-derived",
                  "submitter/reviewer identities, reviewer authorization, public-domain rights",
                  "metadata, server-computed cue digest, approved-adapter reload through the",
                  "production policy, immutable reviewed state, and complete cleanup.",
                  "",
                  "This closes the missing trusted-ingestion mechanism. It does not close the",
                  "public routing gap, live Gemini, persisted browser flow, T075 human review,",
                  "or owner acceptance. Convergence remains **NOT CONVERGED** and the PR remains",
                  "**DO NOT MERGE / DO NOT DEPLOY**.",
                  "",
                  "Evidence: `t061-trusted-transcript-ingestion-verification.md`.",
                  "",
              ])
          convergence_path.write_text(convergence)

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Verify finalized repository
        run: |
          npm run lint
          npx tsc --noEmit
          npm run test:real-talk
          npm run test
          npm run test:content-standard
          npm run build

      - name: Commit finalized T061 state
        shell: bash
        run: |
          rm .github/workflows/spec001-t061-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(spec001): finalize trusted transcript ingestion"
          git push origin HEAD:agent/rebuild-learning-core
