name: Vercel Deploy Monitor

on:
  push:
    branches: [main]

# Only run after the main CI job — we poll Vercel for the real production build
# This catches errors that only appear with real Vercel env vars (VAPID keys, Redis, etc.)

concurrency:
  group: vercel-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-vercel:
    name: Wait for Vercel Deploy & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel deployment to complete
        id: vercel_check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}   # optional — leave empty if personal account
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "🔍 Monitoring Vercel deployment for commit: $COMMIT_SHA"

          # Build API URL — support both personal and team accounts
          if [ -n "$VERCEL_TEAM_ID" ]; then
            TEAM_PARAM="&teamId=$VERCEL_TEAM_ID"
          else
            TEAM_PARAM=""
          fi

          MAX_POLLS=60         # 60 × 15s = 15 minutes max
          POLL_INTERVAL=15     # seconds between polls
          FOUND_DEPLOYMENT=0

          for i in $(seq 1 $MAX_POLLS); do
            echo "--- Poll $i/$MAX_POLLS ---"

            # Fetch latest deployments for this project
            RESPONSE=$(curl -sf \
              "https://api.vercel.com/v6/deployments?projectId=atoenglish&limit=5$TEAM_PARAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" 2>&1) || {
              echo "⚠️  Vercel API call failed (network/auth issue), will retry..."
              sleep $POLL_INTERVAL
              continue
            }

            # Find deployment matching this commit SHA
            DEPLOYMENT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          deployments = data.get('deployments', [])
          sha = '$COMMIT_SHA'
          for d in deployments:
              meta = d.get('meta', {})
              if meta.get('githubCommitSha', '').startswith(sha[:12]) or d.get('url', '') != '':
                  print(json.dumps(d))
                  break
          " 2>/dev/null)

            if [ -z "$DEPLOYMENT" ]; then
              echo "⏳ Deployment not found yet, waiting ${POLL_INTERVAL}s..."
              sleep $POLL_INTERVAL
              continue
            fi

            FOUND_DEPLOYMENT=1
            STATE=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','UNKNOWN'))")
            DEPLOY_URL=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))")
            DEPLOY_ID=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uid',''))")

            echo "📊 Deployment state: $STATE"
            echo "🔗 URL: https://$DEPLOY_URL"

            case "$STATE" in
              READY)
                echo ""
                echo "✅ Vercel deployment SUCCEEDED!"
                echo "🌐 Live at: https://$DEPLOY_URL"
                echo "deploy_url=https://$DEPLOY_URL" >> $GITHUB_OUTPUT
                echo "deploy_state=READY" >> $GITHUB_OUTPUT
                exit 0
                ;;
              ERROR|CANCELED)
                echo ""
                echo "❌ Vercel deployment FAILED with state: $STATE"
                echo ""

                # Fetch build error logs
                echo "📋 Fetching build logs..."
                LOG_RESPONSE=$(curl -sf \
                  "https://api.vercel.com/v2/deployments/$DEPLOY_ID/events?direction=backward&limit=100$TEAM_PARAM" \
                  -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null) || echo "Could not fetch logs"

                if [ -n "$LOG_RESPONSE" ] && [ "$LOG_RESPONSE" != "Could not fetch logs" ]; then
                  echo "--- Last 50 build log lines ---"
                  echo "$LOG_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          events = data if isinstance(data, list) else data.get('events', [])
          for e in events[-50:]:
              text = e.get('text', '') or e.get('payload', {}).get('text', '')
              if text:
                  print(text)
          " 2>/dev/null || echo "$LOG_RESPONSE" | tail -100
                fi

                echo "deploy_state=ERROR" >> $GITHUB_OUTPUT
                exit 1
                ;;
              BUILDING|INITIALIZING|QUEUED|DEPLOYING)
                echo "⏳ Still building... waiting ${POLL_INTERVAL}s"
                sleep $POLL_INTERVAL
                continue
                ;;
              *)
                echo "❓ Unknown state: $STATE — waiting..."
                sleep $POLL_INTERVAL
                continue
                ;;
            esac
          done

          if [ "$FOUND_DEPLOYMENT" = "0" ]; then
            echo "⚠️  Warning: No matching Vercel deployment found for commit $COMMIT_SHA after $MAX_POLLS polls"
            echo "This may indicate the deployment hasn't started yet or the project name is wrong."
            echo "Check manually: https://vercel.com/thunderkill016/atoenglish"
            exit 0   # Don't fail — deployment may be queued
          fi

          echo "⏱️  Timed out waiting for Vercel deployment after 15 minutes"
          exit 1

      - name: Comment deploy status on commit (failure only)
        if: failure() && steps.vercel_check.outputs.deploy_state == 'ERROR'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## ❌ Vercel Deployment Failed\n\nThe production deployment for commit \`${context.sha.slice(0,7)}\` failed on Vercel.\n\n**Check the [Vercel Dashboard](https://vercel.com/thunderkill016/atoenglish) for full build logs.**\n\nCommon causes:\n- Missing environment variables (VAPID keys, Redis URL)\n- Next.js build error not caught by local build\n- Edge runtime incompatibility\n\n> Fix the error, then push a new commit to trigger a fresh deploy.`
            })
