# Vercel deploy monitor — CHỈ manual / weekly (daemon local đã chạy check-deploy mỗi cycle)
# Tiết kiệm ~10–15 phút mỗi push main trên GitHub Actions.

name: Vercel Deploy Monitor

on:
  schedule:
    - cron: "0 8 * * 1"  # Thứ 2 08:00 UTC
  workflow_dispatch:

concurrency:
  group: vercel-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-vercel:
    name: Wait for Vercel Deploy & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deployment to complete
        id: vercel_check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "🔍 Monitoring Vercel deployment for commit: $COMMIT_SHA"

          if [ -n "$VERCEL_TEAM_ID" ]; then
            TEAM_PARAM="&teamId=$VERCEL_TEAM_ID"
          else
            TEAM_PARAM=""
          fi

          MAX_POLLS=60
          POLL_INTERVAL=15
          FOUND_DEPLOYMENT=0

          for i in $(seq 1 $MAX_POLLS); do
            echo "--- Poll $i/$MAX_POLLS ---"

            RESPONSE=$(curl -sf \
              "https://api.vercel.com/v6/deployments?projectId=atoenglish&limit=5$TEAM_PARAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" 2>&1) || {
              echo "⚠️  Vercel API call failed, will retry..."
              sleep $POLL_INTERVAL
              continue
            }

            DEPLOYMENT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          deployments = data.get('deployments', [])
          sha = '$COMMIT_SHA'
          for d in deployments:
              meta = d.get('meta', {})
              if meta.get('githubCommitSha', '').startswith(sha[:12]) or d.get('url', '') != '':
                  print(json.dumps(d))
                  break
          " 2>/dev/null)

            if [ -z "$DEPLOYMENT" ]; then
              echo "⏳ Deployment not found yet..."
              sleep $POLL_INTERVAL
              continue
            fi

            FOUND_DEPLOYMENT=1
            STATE=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','UNKNOWN'))")
            DEPLOY_URL=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))")
            DEPLOY_ID=$(echo "$DEPLOYMENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uid',''))")

            echo "📊 Deployment state: $STATE"
            echo "🔗 URL: https://$DEPLOY_URL"

            case "$STATE" in
              READY)
                echo "✅ Vercel deployment SUCCEEDED!"
                echo "deploy_url=https://$DEPLOY_URL" >> $GITHUB_OUTPUT
                echo "deploy_state=READY" >> $GITHUB_OUTPUT
                exit 0
                ;;
              ERROR|CANCELED)
                echo "❌ Vercel deployment FAILED: $STATE"
                LOG_RESPONSE=$(curl -sf \
                  "https://api.vercel.com/v2/deployments/$DEPLOY_ID/events?direction=backward&limit=100$TEAM_PARAM" \
                  -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null) || echo "Could not fetch logs"
                if [ -n "$LOG_RESPONSE" ] && [ "$LOG_RESPONSE" != "Could not fetch logs" ]; then
                  echo "$LOG_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          events = data if isinstance(data, list) else data.get('events', [])
          for e in events[-50:]:
              text = e.get('text', '') or e.get('payload', {}).get('text', '')
              if text: print(text)
          " 2>/dev/null || echo "$LOG_RESPONSE" | tail -100
                fi
                echo "deploy_state=ERROR" >> $GITHUB_OUTPUT
                exit 1
                ;;
              *)
                sleep $POLL_INTERVAL
                ;;
            esac
          done

          if [ "$FOUND_DEPLOYMENT" = "0" ]; then
            echo "⚠️  No matching deployment found — check Vercel dashboard"
            exit 0
          fi
          echo "⏱️  Timed out after 15 minutes"
          exit 1