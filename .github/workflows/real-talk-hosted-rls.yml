name: Real Talk Hosted RLS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: real-talk-hosted-rls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-session-postgrest:
    name: Signed-session PostgREST RLS
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/rebuild-learning-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      HUSKY: 0
      NEXT_PUBLIC_SUPABASE_URL: https://zpiwddskhduuykpxltun.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_oZXiqT2WT8JNxy6DC9WbkQ_B-YjjmPr' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify protected test credential
        shell: bash
        run: |
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::error::A repository secret named SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SERVICE_KEY is required."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Run owner A, owner B, and anonymous signed-session RLS scaffold
        run: >-
          npx vitest run
          --config vitest.integration.config.ts
          src/__tests__/integration/real-talk-draft-rls.integration.test.ts
