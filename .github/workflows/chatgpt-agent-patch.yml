name: ChatGPT Agent Patch

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "scripts/chatgpt-agent-patch.mjs"

permissions:
  contents: write

concurrency:
  group: chatgpt-agent-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Apply deterministic patch
        run: node scripts/chatgpt-agent-patch.mjs

      - name: Remove retired dependencies
        run: npm uninstall canvas-confetti @types/canvas-confetti web-push @types/web-push --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Content standards
        run: npm run test:content-standard

      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "chatgpt-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(scope): retire lesson gamification runtime"
          git push origin HEAD:${{ github.ref_name }}
