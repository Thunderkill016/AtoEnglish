name: Pilot promise E2E diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply focused copy patch
        run: |
          cp scripts/align-pilot-promise.py /tmp/align-pilot-promise.py
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/align-pilot-promise.py")
          text = path.read_text().replace(
              '"                           <span>Đã thiết lập xong lộ trình tối ưu!</span>"',
              '"<span>Đã thiết lập xong lộ trình tối ưu!</span>"',
          )
          path.write_text(text)
          PY
          python /tmp/align-pilot-promise.py
      - name: Install and build quietly
        run: |
          npm ci --ignore-scripts --legacy-peer-deps >/tmp/npm-ci.log 2>&1
          npx playwright install --with-deps chromium >/tmp/chromium.log 2>&1
          npm run build >/tmp/build.log 2>&1
      - name: Start production server
        run: |
          npm run start > /tmp/atoenglish.log 2>&1 &
          npx wait-on http-get://127.0.0.1:3000/ --timeout 60000
      - name: Run promise E2E with focused output
        run: |
          set +e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/protected-routes.spec.ts --project=chromium --reporter=line > /tmp/e2e.log 2>&1
          code=$?
          tail -160 /tmp/e2e.log
          exit $code
