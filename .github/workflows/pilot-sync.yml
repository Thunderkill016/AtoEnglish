name: Pilot promise validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused copy patch
        run: |
          cp scripts/align-pilot-promise.py /tmp/align-pilot-promise.py
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/align-pilot-promise.py")
          text = path.read_text()
          text = text.replace(
              '"                           <span>Đã thiết lập xong lộ trình tối ưu!</span>"',
              '"<span>Đã thiết lập xong lộ trình tối ưu!</span>"',
          )
          path.write_text(text)
          PY
          python /tmp/align-pilot-promise.py

      - name: Verify focused scope
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          e2e/protected-routes.spec.ts
          src/app/(main)/dashboard/components/DashboardClient.tsx
          src/app/layout.tsx
          src/app/login/page.tsx
          src/app/page.tsx
          src/components/landing/FaqSection.tsx
          src/components/landing/FinalCtaSection.tsx
          src/components/landing/HeroCTA.tsx
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Clean install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inventory
        run: npm run inventory

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full lint
        run: npm run lint

      - name: Full unit tests
        run: npm run test

      - name: Lesson content standard
        run: npm run test:content-standard

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/atoenglish.log 2>&1 &
          npx wait-on http-get://127.0.0.1:3000/ --timeout 60000

      - name: Protected-route and promise E2E
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/protected-routes.spec.ts --project=chromium

      - name: Lesson production smoke E2E
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/lesson-smoke.spec.ts

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No uncommitted changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/protected-routes.spec.ts \
            'src/app/(main)/dashboard/components/DashboardClient.tsx' \
            src/app/layout.tsx \
            src/app/login/page.tsx \
            src/app/page.tsx \
            src/components/landing/FaqSection.tsx \
            src/components/landing/FinalCtaSection.tsx \
            src/components/landing/HeroCTA.tsx
          git commit -m "copy: align the 28-day speaking pilot promise"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
