name: Pilot promise patch diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Run focused copy patch
        run: python scripts/align-pilot-promise.py
      - name: Show changed files
        if: success()
        run: git diff --name-only
