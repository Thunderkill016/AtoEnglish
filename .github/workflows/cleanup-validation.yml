name: Cleanup validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "reports/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/cleanup-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate cleanup inventory
        run: npm run inventory -- --write

      - name: Upload cleanup inventory
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-inventory
          path: reports/codebase-inventory.generated.md
          if-no-files-found: error

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
