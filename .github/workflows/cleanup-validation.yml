name: Cleanup validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "reports/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/cleanup-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate cleanup inventory
        run: npm run inventory -- --write

      - name: Verify first deletion candidate
        shell: bash
        run: |
          {
            echo "# unit-content.ts repository verification"
            echo
            echo "## References excluding the candidate file"
            git grep -n -E 'seedUnitContent|getUnitContent|unit-content|unit_content' -- . ':(exclude)src/app/actions/unit-content.ts' || true
            echo
            echo "## Direct import-path references excluding the candidate file"
            git grep -n -E '@/app/actions/unit-content|app/actions/unit-content' -- . ':(exclude)src/app/actions/unit-content.ts' || true
          } > reports/unit-content-verification.txt

      - name: Upload cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-evidence
          path: |
            reports/codebase-inventory.generated.md
            reports/unit-content-verification.txt
          if-no-files-found: error

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
