name: Cleanup validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "reports/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/cleanup-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate cleanup inventory
        run: npm run inventory -- --write

      - name: Verify next cleanup candidates
        shell: bash
        run: |
          {
            echo "# Cleanup candidate repository verification"
            for entry in \
              'src/app/(main)/dashboard/components/DashboardMinimalClient.tsx|DashboardMinimalClient|dashboard/components/DashboardMinimalClient' \
              'src/components/learn/lesson-ui/LessonHeader.tsx|LessonHeader|learn/lesson-ui/LessonHeader' \
              'src/components/learn/lesson-ui/LessonShell.tsx|LessonShell|learn/lesson-ui/LessonShell'
            do
              IFS='|' read -r file symbol import_path <<< "$entry"
              echo
              echo "## $file"
              echo "### Symbol and path references excluding candidate"
              git grep -n -E "$symbol|$import_path" -- . \
                ":(exclude)$file" \
                ':(exclude).github/workflows/cleanup-validation.yml' \
                ':(exclude)reports/**' \
                ':(exclude)AGENT_BACKLOG.md' \
                ':(exclude)AGENT_PLAN.md' || true
            done
          } > reports/cleanup-candidate-verification.txt

      - name: Upload cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-evidence
          path: |
            reports/codebase-inventory.generated.md
            reports/cleanup-candidate-verification.txt
            scripts/audit-code.mjs
          if-no-files-found: error

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
