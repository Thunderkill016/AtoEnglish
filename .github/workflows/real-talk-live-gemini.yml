name: Real Talk Live Gemini

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/live-verification/real-talk-gemini.trigger

concurrency:
  group: real-talk-live-gemini-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-gemini:
    name: Live provider and fail-closed probes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      HUSKY: 0
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirm server-only Gemini key exists
        shell: bash
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Run sanitized live Gemini probes
        run: npm run test:real-talk:live
