name: Pilot speaking assessment verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify focused scope
        run: |
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/pilot-speaking-assessment.yml
          docs/pilot-speaking-assessment.md
          src/lib/pilot/speaking-assessment.test.ts
          src/lib/pilot/speaking-assessment.ts
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Clean install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inventory
        run: npm run inventory

      - name: Targeted assessment tests
        run: npx vitest run src/lib/pilot/speaking-assessment.test.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full lint
        run: npm run lint

      - name: Full unit tests
        run: npm run test

      - name: Lesson content standard
        run: npm run test:content-standard

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/atoenglish.log 2>&1 &
          npx wait-on http-get://127.0.0.1:3000/ --timeout 60000

      - name: Lesson production smoke E2E
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/lesson-smoke.spec.ts --workers=1
