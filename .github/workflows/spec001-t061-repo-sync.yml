name: Spec 001 T061 Repo Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      HUSKY: 0
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize hosted types and targeted suite
        shell: python
        run: |
          import base64
          import json
          from pathlib import Path

          types_path = Path("src/types/supabase.ts")
          types = types_path.read_text()
          table_name = "      real_talk_transcript_sources: {"
          marker = "      real_talk_videos: {"
          encoded = ""
          block = base64.b64decode(encoded).decode()
          if table_name not in types:
              if types.count(marker) != 1:
                  raise SystemExit("Expected one real_talk_videos marker")
              types = types.replace(marker, block + marker, 1)
              types_path.write_text(types)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          command = package["scripts"]["test:real-talk"]
          additions = [
              "src/__tests__/real-talk-trusted-transcript-ingestion.test.ts",
              "src/__tests__/real-talk-reviewed-transcript-adapter.test.ts",
          ]
          for test_path in additions:
              if test_path not in command:
                  command += f" {test_path}"
          package["scripts"]["test:real-talk"] = command
          package_path.write_text(json.dumps(package, indent=2) + "\n")

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Verify synchronized repository
        run: |
          npm run lint
          npx tsc --noEmit
          npm run test:real-talk
          npm run test

      - name: Commit synchronized repository
        shell: bash
        run: |
          rm .github/workflows/spec001-t061-repo-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(spec001): sync trusted transcript hosted schema"
          git push origin HEAD:agent/rebuild-learning-core
