name: Spec 001 Hosted Schema Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      HUSKY: 0
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core
          fetch-depth: 0

      - name: Apply hosted schema truth and evidence
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          root = Path.cwd()

          types_path = root / "src/types/supabase.ts"
          types = types_path.read_text()
          replacements = [
              (
                  "topics: string[]\nyoutube_id: string",
                  "topics: string[]\ntranscript_acquisition_mode: string\ntranscript_cue_digest: string | null\ntranscript_review_status: string\ntranscript_source_metadata: Json\nyoutube_id: string",
                  "Row provenance",
              ),
              (
                  "topics?: string[]\nyoutube_id: string",
                  "topics?: string[]\ntranscript_acquisition_mode?: string\ntranscript_cue_digest?: string | null\ntranscript_review_status?: string\ntranscript_source_metadata?: Json\nyoutube_id: string",
                  "Insert provenance",
              ),
              (
                  "topics?: string[]\nyoutube_id?: string",
                  "topics?: string[]\ntranscript_acquisition_mode?: string\ntranscript_cue_digest?: string | null\ntranscript_review_status?: string\ntranscript_source_metadata?: Json\nyoutube_id?: string",
                  "Update provenance",
              ),
              (
                  "      units_required_for_level: { Args: { level: string }; Returns: number }\n      use_streak_freeze: { Args: { p_user_id: string }; Returns: Json }",
                  "      units_required_for_level: { Args: { level: string }; Returns: number }\n      upsert_real_talk_private_draft: {\n        Args: { p_lesson: Json; p_video: Json }\n        Returns: {\n          lesson_id: string\n          video_id: string\n        }[]\n      }\n      use_streak_freeze: { Args: { p_user_id: string }; Returns: Json }",
                  "RPC type",
              ),
          ]
          for old, new, label in replacements:
              count = types.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              types = types.replace(old, new, 1)
          if types.count("transcript_acquisition_mode: string") != 1:
              raise SystemExit("generated provenance Row count mismatch")
          if types.count("upsert_real_talk_private_draft:") != 1:
              raise SystemExit("generated RPC count mismatch")
          types_path.write_text(types)

          atomic_path = root / "supabase/migrations/20260803013000_real_talk_atomic_private_draft.sql"
          replace_once(
              atomic_path,
              "  ON CONFLICT (video_id) DO UPDATE",
              "  ON CONFLICT ON CONSTRAINT real_talk_lessons_video_id_key DO UPDATE",
              "atomic lesson conflict target",
          )
          atomic = atomic_path.read_text()
          function_start = atomic.index("CREATE OR REPLACE FUNCTION")
          fix_path = root / "supabase/migrations/20260803081500_fix_real_talk_atomic_private_draft_conflict.sql"
          fix_path.write_text(
              "-- Fix PL/pgSQL ambiguity between the RETURNS TABLE output column `video_id`\n"
              "-- and the real_talk_lessons conflict target. Naming the unique constraint keeps\n"
              "-- the upsert deterministic without changing RPC inputs, outputs, privileges, or RLS.\n\n"
              + atomic[function_start:]
          )

          app_db_path = root / "src/types/app-database.ts"
          app_db_path.write_text('''import type { PendingLearningAttemptTable } from "@/types/pending-learning-attempts";
          import type { Database } from "@/types/supabase";

          type GeneratedPublicTables = Database["public"]["Tables"];
          type PublicTablesWithPendingMigrations = Omit<
            GeneratedPublicTables,
            "learning_attempts"
          > & {
            learning_attempts: PendingLearningAttemptTable;
          };

          /**
           * App-level database type layered on the full hosted Supabase snapshot.
           *
           * The only remaining overlay is `learning_attempts`, whose versioned
           * migration `20260731162613_learning_attempts.sql` is not present in the
           * hosted project. Real Talk provenance fields and the atomic draft RPC are
           * generated directly from hosted schema truth.
           */
          export type AppDatabase = Omit<Database, "public"> & {
            public: Omit<Database["public"], "Tables"> & {
              Tables: PublicTablesWithPendingMigrations;
            };
          };
          '''.replace("          ", ""))

          atomic_test = root / "src/__tests__/real-talk-atomic-draft-migration.test.ts"
          replace_once(
              atomic_test,
              'expect(sql).toContain("on conflict (video_id) do update");',
              'expect(sql).toContain(\n      "on conflict on constraint real_talk_lessons_video_id_key do update",\n    );',
              "atomic migration contract",
          )

          fix_test = root / "src/__tests__/real-talk-atomic-draft-hosted-fix-migration.test.ts"
          fix_test.write_text('''import { readFileSync } from "node:fs";
          import { join } from "node:path";

          import { describe, expect, it } from "vitest";

          const sql = readFileSync(
            join(
              process.cwd(),
              "supabase/migrations/20260803081500_fix_real_talk_atomic_private_draft_conflict.sql",
            ),
            "utf8",
          )
            .replace(/\\s+/g, " ")
            .trim()
            .toLowerCase();

          describe("hosted Real Talk atomic RPC conflict fix", () => {
            it("uses a named lesson uniqueness target", () => {
              expect(sql).toContain(
                "create or replace function public.upsert_real_talk_private_draft",
              );
              expect(sql).toContain(
                "on conflict on constraint real_talk_lessons_video_id_key do update",
              );
              expect(sql).not.toContain("on conflict (video_id) do update");
            });

            it("preserves security-invoker execution and explicit grants", () => {
              expect(sql).toContain("security invoker");
              expect(sql).toContain("from public");
              expect(sql).toContain("from anon");
              expect(sql).toContain("to authenticated");
              expect(sql).toContain("to service_role");
            });
          });
          '''.replace("          ", ""))

          pending_test = root / "src/__tests__/supabase-pending-schema-contract.test.ts"
          replace_once(
              pending_test,
              '''  it("retains the pending Real Talk provenance and atomic RPC overlay", () => {
              expect(appDatabase).toContain("RealTalkTables");
              expect(appDatabase).toContain("RealTalkFunctions");
              expect(appDatabase).toContain("T060");
              expect(appDatabase).toContain("T067");
            });'''.replace("            ", ""),
              '''  it("uses hosted generated Real Talk provenance and RPC types", () => {
              expect(hostedTypes).toContain("transcript_acquisition_mode: string");
              expect(hostedTypes).toContain("transcript_review_status: string");
              expect(hostedTypes).toContain("transcript_source_metadata: Json");
              expect(hostedTypes).toContain("upsert_real_talk_private_draft:");
              expect(appDatabase).not.toContain("RealTalkTables");
              expect(appDatabase).not.toContain("RealTalkFunctions");
              expect(appDatabase).not.toContain("T060");
              expect(appDatabase).not.toContain("T067");
            });'''.replace("            ", ""),
              "pending schema contract",
          )

          old_fragment = root / "src/types/real-talk-supabase.generated.ts"
          if old_fragment.exists():
              old_fragment.unlink()

          tasks_path = root / "specs/001-private-natural-lesson-compiler/tasks.md"
          tasks = tasks_path.read_text()
          tasks = tasks.replace(
              '''- [x] T049 [US3] Replace the full local generated `src/types/supabase.ts` and prove
            hosted-schema equivalence; the generated baseline now matches project
            `zpiwddskhduuykpxltun`, while explicit app-level overlays remain for unapplied
            migration `20260731162613_learning_attempts.sql`, T060 provenance fields, and
            the T067 atomic RPC; evidence is recorded in
            `t049-hosted-types-verification.md`'''.replace("            ", ""),
              '''- [x] T049 [US3] Replace the full local generated `src/types/supabase.ts` and prove
            hosted-schema equivalence; the generated baseline matches project
            `zpiwddskhduuykpxltun`. After T060 and T067, only the unapplied
            `20260731162613_learning_attempts.sql` remains as an app-level overlay;
            evidence is recorded in `t049-hosted-types-verification.md`'''.replace("            ", ""),
          )
          tasks = tasks.replace(
              '''- [ ] T060 Obtain owner authorization, apply the provenance migration to hosted
            Supabase, rerun advisors, regenerate full hosted types, and execute trusted
            write/tamper verification'''.replace("            ", ""),
              '''- [x] T060 Obtain owner authorization, apply the provenance migration to hosted
            Supabase, rerun advisors, regenerate full hosted types, and execute trusted
            write/tamper verification; hosted migration `20260803011348`, service-role
            trusted write, owner read, tamper rejection, cleanup, and generated types
            are recorded in `t060-t067-hosted-schema-verification.md`'''.replace("            ", ""),
          )
          tasks = tasks.replace(
              '''- [ ] T067 Apply the atomic RPC migration to hosted Supabase with explicit owner
            authorization and verify rollback after a controlled lesson failure'''.replace("            ", ""),
              '''- [x] T067 Apply the atomic RPC migration to hosted Supabase with explicit owner
            authorization and verify rollback after a controlled lesson failure; the
            initial hosted probe exposed an ambiguous `video_id` conflict target, fixed by
            migration `20260803011736`; repeat identity, update, rollback, publication
            rejection, and cleanup evidence is recorded in
            `t060-t067-hosted-schema-verification.md`'''.replace("            ", ""),
          )
          tasks = tasks.replace(
              "Hosted new DDL:         NOT APPLIED",
              "Hosted provenance/RPC:  PASS; migrations applied and verified",
          )
          tasks_path.write_text(tasks)

          evidence_path = root / "specs/001-private-natural-lesson-compiler/t060-t067-hosted-schema-verification.md"
          evidence_path.write_text('''# T060 and T067 Hosted Schema Verification

          **Observed:** 2026-08-03  
          **Supabase project:** `zpiwddskhduuykpxltun`  
          **Owner authorization:** explicit in the active conversation  
          **Application deployment:** none

          ## Applied hosted migrations

          | Hosted version | Name |
          | --- | --- |
          | `20260803011348` | `real_talk_transcript_provenance` |
          | `20260803011431` | `real_talk_atomic_private_draft` |
          | `20260803011736` | `fix_real_talk_atomic_private_draft_conflict` |

          Preflight observed zero rows in both Real Talk tables and confirmed that the
          provenance columns and RPC were absent.

          ## Provenance verification — T060

          The hosted schema now contains all four provenance columns, four constraints,
          the write-gate trigger, and the transcript-mode index.

          A bounded role/JWT transaction observed:

          - service role inserted valid `creator_provided` / `human_verified` metadata;
          - the authenticated owner could read the private row;
          - the owner could not alter the approved digest or metadata;
          - the stored digest and metadata remained unchanged;
          - the fixture video and Auth user were deleted.

          Result:

          ```text
          trusted_write_persisted = true
          owner_can_read          = true
          owner_tamper_rejected   = true
          digest_unchanged        = true
          cleanup_video           = true
          cleanup_auth_user       = true
          ```

          ## Atomic RPC verification — T067

          The first authenticated hosted probe failed before any durable write with:

          ```text
          column reference "video_id" is ambiguous
          ```

          The conflict was between the function's `RETURNS TABLE(video_id, lesson_id)`
          output variable and `ON CONFLICT (video_id)`. The surrounding transaction
          rolled back. A follow-up migration replaced the target with the named unique
          constraint `real_talk_lessons_video_id_key`.

          The repeated probe then observed:

          ```text
          same_video_id              = true
          same_lesson_id             = true
          one_current_video          = true
          updated_video_title        = true
          updated_lesson_title       = true
          failed_write_left_no_video = true
          publication_rejected       = true
          cleanup_auth_user          = true
          cleanup_videos             = true
          cleanup_lessons            = true
          ```

          This proves hosted RPC transaction and RLS behavior. It does not claim that
          the Next.js server action itself was executed; T051 and T068 remain open for
          that separate application-process evidence.

          ## Generated types and advisors

          Supabase TypeScript generation after the migrations returned PostgREST `14.5`
          types containing the four provenance fields and
          `upsert_real_talk_private_draft`. The obsolete Real Talk type overlay was
          removed; `AppDatabase` now overlays only the unapplied `learning_attempts`
          migration.

          Security Advisor reported no Real Talk finding. The remaining warning is the
          project-level leaked-password-protection setting. Performance Advisor added
          no actionable Real Talk defect; empty-schema indexes remain `unused_index`
          INFO notices.

          ## Boundary

          - T060: complete.
          - T067: complete.
          - T051/T068 real server-action execution: not yet observed.
          - Production transcript adapter: not implemented.
          - Application deployment: not performed.
          - No fixture rows remain.
          '''.replace("          ", ""))

          hosted_path = root / "specs/001-private-natural-lesson-compiler/hosted-database-verification.md"
          hosted = hosted_path.read_text()
          hosted += '''

          ## 2026-08-03 provenance and atomic RPC follow-up

          With explicit owner authorization, hosted migrations
          `20260803011348`, `20260803011431`, and corrective migration
          `20260803011736` were applied. Trusted provenance write/tamper checks and
          authenticated atomic repeat/rollback checks passed with full fixture cleanup.
          Full generated types now contain the hosted provenance columns and RPC; the
          old Real Talk reconciliation fragment is no longer used.

          Detailed evidence is recorded in
          `t060-t067-hosted-schema-verification.md`.
          '''.replace("          ", "")
          hosted_path.write_text(hosted)

          workflow = root / ".github/workflows/spec001-hosted-schema-sync.yml"
          workflow.unlink()

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Targeted schema tests
        run: npx vitest run --config vitest.node.config.ts src/__tests__/real-talk-atomic-draft-migration.test.ts src/__tests__/real-talk-atomic-draft-hosted-fix-migration.test.ts src/__tests__/supabase-pending-schema-contract.test.ts src/__tests__/real-talk-transcript-provenance-migration.test.ts

      - name: Commit hosted schema sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spec001): verify hosted provenance and atomic persistence"
          git push origin HEAD:agent/rebuild-learning-core
