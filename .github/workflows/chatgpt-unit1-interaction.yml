name: ChatGPT Unit 1 Interaction

# Temporary bounded runner for the Unit 1 interaction patch.
on:
  push:
    branches:
      - "feat/unit1-turn-based-speaking"
    paths:
      - "scripts/chatgpt-unit1-interaction-correction.py"
      - ".github/workflows/chatgpt-unit1-interaction.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    env:
      CI: true
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --prefer-offline
      - run: python3 scripts/chatgpt-unit1-interaction-correction.py
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run test:content-standard
      - name: Commit verified product patch
        run: |
          git config user.name "chatgpt-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/learn/sections/SpeakingSection.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(learn): enforce Unit 1 interaction gate"
          git push origin HEAD:${{ github.ref_name }}
