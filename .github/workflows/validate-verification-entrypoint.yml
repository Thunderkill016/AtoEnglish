name: Validate curriculum verification entry point

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - scripts/verification-plan.mjs
      - scripts/verification-plan.test.mjs
      - scripts/verify-change.mjs
      - docs/product/VERIFICATION_ENTRYPOINT.md
      - .github/workflows/validate-verification-entrypoint.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run repository verification entry point
        run: npm run verify
