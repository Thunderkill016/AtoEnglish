# CI — tối ưu phút GitHub Actions (private repo ~2000 phút/tháng)
#
# Push main  → fast: lint + test (~3 phút) — build/E2E chạy local daemon + Vercel
# PR         → full: lint + tsc + coverage + build
# Chủ nhật   → full + E2E (weekly gate)
# [skip ci]  → bỏ qua (agent chore commits)
# paths-ignore → không chạy khi chỉ đổi audio/agent docs

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "AGENT_*.md"
      - "AGENT_REPORT.md"
      - "logs/**"
      - "public/audio/**"
  schedule:
    # Chủ nhật 06:00 UTC — full pipeline 1 lần/tuần
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-check:
    name: Skip [skip ci] commits
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "${{ github.event_name }}" == "push" ]] && echo "$MSG" | grep -qi '\[skip ci\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping CI ([skip ci] in commit message)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  ci-fast:
    name: Lint · Test (fast — push main)
    needs: skip-check
    if: needs.skip-check.outputs.skip != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run lint

      - run: npm run test

  ci-full:
    name: Lint · Type · Test · Build
    needs: skip-check
    if: needs.skip-check.outputs.skip != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm audit --audit-level=high --legacy-peer-deps
        continue-on-error: true

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder-token-for-build
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa40TAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VAPID_PRIVATE_KEY: placeholder-vapid-private-key-for-build-only
          VAPID_SUBJECT: mailto:build@atoenglish.vercel.app

  e2e:
    name: E2E Tests
    needs: ci-full
    if: needs.skip-check.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx playwright install chromium --with-deps

      - run: npm run dev &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - run: npx wait-on http://localhost:3000 --timeout 30000

      - run: npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7