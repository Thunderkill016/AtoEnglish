name: Gold Day 1 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/gold-day-1-cefr

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check lesson content standard
        run: npm run test:content-standard

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint changed lesson
        run: npx eslint src/lib/data/units/unitA01.ts

      - name: Production build
        run: npm run build
