name: Prepare verified Gold Day 1 contract

on:
  pull_request:
    branches: [main]
    paths:
      - src/lib/data/units/unitA01.ts
      - scripts/prepare-gold-day-1-contract.py
      - .github/workflows/validate-gold-day-1.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch curriculum contract
        run: python scripts/prepare-gold-day-1-contract.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run full unit suite
        run: npm run test
      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: verified-unit-a0-1
          path: src/lib/data/units/unitA01.ts
          retention-days: 1
