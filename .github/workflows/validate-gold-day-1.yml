name: Diagnose Gold Day 1 focused tests

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/validate-gold-day-1.yml

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run focused lesson tests
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm exec -- vitest run \
            src/components/learn/UnitTemplate.test.tsx \
            src/components/learn/lesson-sections.test.ts \
            src/components/learn/lesson-ui/lesson-presentation.test.tsx \
            2>&1 | tee focused-test.log
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-test-log
          path: focused-test.log
          retention-days: 1
      - name: Preserve focused test verdict
        if: steps.focused.outcome == 'failure'
        run: exit 1
