name: Diagnose Gold Day 1 full unit suite

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/validate-gold-day-1.yml

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run full unit suite
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee full-unit.log
      - name: Upload full unit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-unit-log
          path: full-unit.log
          retention-days: 1
      - name: Preserve full unit verdict
        if: steps.unit.outcome == 'failure'
        run: exit 1
