name: Validate Gold Day 1 with verification entry point

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - package.json
      - .github/workflows/validate-gold-day-1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout Gold Day 1 branch
        uses: actions/checkout@v4
      - name: Checkout verification entry point
        uses: actions/checkout@v4
        with:
          ref: agent/curriculum-verification-entrypoint
          path: .verification-entrypoint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run curriculum verification entry point
        id: verification
        continue-on-error: true
        run: node .verification-entrypoint/scripts/verify-change.mjs --scope curriculum
      - name: Diagnose focused lesson tests
        if: steps.verification.outcome == 'failure'
        continue-on-error: true
        run: npm exec -- vitest run src/components/learn/UnitTemplate.test.tsx src/components/learn/lesson-sections.test.ts src/components/learn/lesson-ui/lesson-presentation.test.tsx
      - name: Diagnose lesson content standards
        if: steps.verification.outcome == 'failure'
        continue-on-error: true
        run: npm run test:content-standard
      - name: Diagnose TypeScript
        if: steps.verification.outcome == 'failure'
        continue-on-error: true
        run: npm exec -- tsc --noEmit
      - name: Diagnose ESLint
        if: steps.verification.outcome == 'failure'
        continue-on-error: true
        run: npm run lint
      - name: Diagnose full unit suite
        if: steps.verification.outcome == 'failure'
        continue-on-error: true
        run: npm run test
      - name: Diagnose production build
        if: steps.verification.outcome == 'failure'
        continue-on-error: true
        run: npm run build
      - name: Preserve verification verdict
        if: steps.verification.outcome == 'failure'
        run: exit 1
