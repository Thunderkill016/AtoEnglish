name: Rebuild next cleanup PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: "12"
      HEAD_BRANCH: agent/unit-template-types-and-constants
      ORIGINAL_BASE_SHA: f810dda1ac03a8ffe781ab1470f8727450b9d162
      ORIGINAL_HEAD_SHA: b88f1e4cb40231faf43882ebf6f1ddf063a7a717
      COMMIT_TITLE: "refactor: extract UnitTemplate types and section constants"
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify exact PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"
          name="${repo##*/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          test "$(gh api "repos/${repo}/pulls/${PR_NUMBER}" --jq '.state')" = "open"
          test "$(gh api "repos/${repo}/pulls/${PR_NUMBER}" --jq '.draft')" = "false"
          unresolved=$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner="$owner" -f name="$name" -F number="$PR_NUMBER" --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          test "$unresolved" -eq 0
          git fetch origin main --force
          git diff --exit-code "$ORIGINAL_BASE_SHA" origin/main -- .
          git diff --binary "$ORIGINAL_BASE_SHA" "$ORIGINAL_HEAD_SHA" -- . > /tmp/pr.patch
          git checkout -B "$HEAD_BRANCH" origin/main
          git apply --index --binary /tmp/pr.patch
          git diff --cached --check
          git diff --exit-code "$ORIGINAL_HEAD_SHA" -- .
          git commit -m "$COMMIT_TITLE"
          git push --force origin "HEAD:$HEAD_BRANCH"
          gh api "repos/${repo}/pulls/${PR_NUMBER}" -X PATCH -f base=main >/dev/null
