name: Diagnose merged browser validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: final-main-validation-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify expected final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6229c0202cd0199dd67cdbb96de86f5c61a8e812"
          git fetch origin agent/unit-template-progress-persistence-hook --force
          git diff --exit-code FETCH_HEAD HEAD -- .

      - name: Clean install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/final-server.log 2>&1 &
          echo $! > /tmp/final-server.pid
          npx wait-on --timeout 120000 http://127.0.0.1:3000

      - name: Protected-route E2E with captured output
        id: protected
        shell: bash
        run: |
          set +e
          npx playwright test e2e/protected-routes.spec.ts --project=chromium --reporter=line 2>&1 | tee /tmp/protected-e2e.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lesson smoke E2E with captured output
        id: lesson
        shell: bash
        run: |
          set +e
          npx playwright test e2e/lesson-smoke.spec.ts --reporter=line 2>&1 | tee /tmp/lesson-e2e.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-cleanup-browser-diagnostics
          path: |
            /tmp/final-server.log
            /tmp/protected-e2e.log
            /tmp/lesson-e2e.log
            test-results
          if-no-files-found: warn

      - name: Enforce browser suite results
        shell: bash
        run: |
          test "${{ steps.protected.outputs.status }}" = "0"
          test "${{ steps.lesson.outputs.status }}" = "0"
