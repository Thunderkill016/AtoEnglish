name: Validate merged cleanup stack

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-main:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: final-main-validation-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify expected final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6229c0202cd0199dd67cdbb96de86f5c61a8e812"
          git fetch origin agent/unit-template-progress-persistence-hook --force
          git diff --exit-code FETCH_HEAD HEAD -- .

      - name: Clean install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate inventory
        run: npm run inventory -- --write

      - name: Verify inventory summary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Source files scanned: 348" reports/codebase-cleanup-inventory.md
          grep -F "Known entry points: 122" reports/codebase-cleanup-inventory.md
          grep -F "Unreachable candidates: 0" reports/codebase-cleanup-inventory.md

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full lint
        run: npm run lint

      - name: Full unit tests
        run: npm run test

      - name: Lesson content-standard tests
        run: npm run test:content-standard

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/atoenglish-server.log 2>&1 &
          echo $! > /tmp/atoenglish-server.pid
          npx wait-on --timeout 120000 http://127.0.0.1:3000

      - name: Protected-route production E2E
        run: npx playwright test e2e/protected-routes.spec.ts --project=chromium

      - name: Lesson production smoke E2E
        run: npx playwright test e2e/lesson-smoke.spec.ts

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short --untracked-files=no

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "main_sha=$(git rev-parse HEAD)"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_files=348"
            echo "entry_points=122"
            echo "unreachable_candidates=0"
          } > /tmp/final-main-validation.txt
          cp /tmp/atoenglish-server.log /tmp/final-server.log 2>/dev/null || true

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-cleanup-main-validation
          path: |
            /tmp/final-main-validation.txt
            /tmp/final-server.log
          if-no-files-found: warn
