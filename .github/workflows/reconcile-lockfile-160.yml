name: Reconcile lockfile for issue 160

on:
  push:
    branches:
      - audit/issue-160-cleanup

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audit/issue-160-cleanup
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock.json with npm 11
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify gitlab-ci-local residue is gone
        run: |
          if grep -q 'gitlab-ci-local' package-lock.json; then
            echo 'gitlab-ci-local residue remains in package-lock.json' >&2
            exit 1
          fi

      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already reconciled'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(cleanup): reconcile npm lockfile'
          git push origin HEAD:audit/issue-160-cleanup
