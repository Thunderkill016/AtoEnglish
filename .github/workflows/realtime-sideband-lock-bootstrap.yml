name: Realtime sideband lock bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.head_ref == 'frontier/realtime-sideband-budget-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Check out frontier branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate deterministic ws lock entries
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact ws@8.21.3
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @types/ws@8.18.1

      - name: Commit dependency metadata if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'package metadata already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Add realtime sideband websocket dependency'
          git push origin HEAD:${{ github.head_ref }}
