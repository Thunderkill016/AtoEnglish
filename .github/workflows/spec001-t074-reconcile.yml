name: Spec 001 T074 Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core

      - name: Reconcile T074 status records
        run: |
          python <<'PY'
          from pathlib import Path

          tasks_path = Path("specs/001-private-natural-lesson-compiler/tasks.md")
          tasks = tasks_path.read_text()
          old = """- [x] T084 Resolve the production transcript policy decision by retaining the
            explicit merge blocker; T061 now verifies a trusted adapter and reviewer flow,
            but public routing, live Gemini, persisted browser evidence, and human review
            remain required before merge or deployment"""
          new = """- [x] T084 Resolve the production transcript policy decision by retaining the
            explicit merge blocker; T061 now verifies a trusted adapter and reviewer flow
            and T074 verifies the authenticated persisted browser loop, while public
            routing, live Gemini, and human review remain required before merge or
            deployment"""
          if tasks.count(old) != 1:
              raise SystemExit("T084 status marker mismatch")
          tasks_path.write_text(tasks.replace(old, new))

          decision_path = Path(
              "specs/001-private-natural-lesson-compiler/production-transcript-decision.md"
          )
          decision = decision_path.read_text()
          old_blockers = """1. the public private-lesson compiler and UI are still wired to the
             production-blocked experimental YouTube path rather than the reviewed
             registry adapter;
          2. T082 live Gemini verification is blocked by the missing GitHub Actions
             secret;
          3. T074 persisted authenticated desktop/mobile browser verification is complete;
          4. T075 human source-language, timing, situation, Vietnamese-guidance, and
             transfer-coherence review is open;
          5. owner acceptance T088 is open;
          6. publication remains outside spec 001."""
          new_blockers = """1. the public private-lesson compiler and UI are still wired to the
             production-blocked experimental YouTube path rather than the reviewed
             registry adapter;
          2. T082 live Gemini verification is blocked by the missing GitHub Actions
             secret;
          3. T075 human source-language, timing, situation, Vietnamese-guidance, and
             transfer-coherence review is open;
          4. owner acceptance T088 is open;
          5. publication remains outside spec 001."""
          if decision.count(old_blockers) != 1:
              raise SystemExit("Production blocker list mismatch")
          decision_path.write_text(decision.replace(old_blockers, new_blockers))

          evidence_path = Path(
              "specs/001-private-natural-lesson-compiler/t074-persisted-preview-verification.md"
          )
          evidence = evidence_path.read_text()
          old_result = "Result:   full repository gates passed before the finalizer commit"
          new_result = """Output:   81fa9c5cad1c941ebb44909e7d9d6f68ad4abed5
          Result:   full repository gates passed before the finalizer commit"""
          if evidence.count(old_result) != 1:
              raise SystemExit("T074 finalizer result marker mismatch")
          evidence_path.write_text(evidence.replace(old_result, new_result))
          PY

      - name: Commit reconciled state
        run: |
          set -euo pipefail
          rm .github/workflows/spec001-t074-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/spec001-t074-reconcile.yml \
            specs/001-private-natural-lesson-compiler/tasks.md \
            specs/001-private-natural-lesson-compiler/production-transcript-decision.md \
            specs/001-private-natural-lesson-compiler/t074-persisted-preview-verification.md
          git commit -m "docs(spec001): reconcile T074 blocker status"
          git push origin HEAD:agent/rebuild-learning-core
