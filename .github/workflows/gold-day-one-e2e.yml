name: Gold Day 1 E2E

on:
  push:
    branches: [agent/gold-day-one]
    paths-ignore:
      - tmp/gold-day-one-e2e-result.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guest-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0
      PLAYWRIGHT_BASE_URL: https://atoenglish-lwocumvoo-thunderkill016s-projects.vercel.app
      VERCEL_SHARE_TOKEN: qsn3Ew0S6mYt323X0w9Ws42Fqs4EGrJy

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-day-one

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --prefer-offline
      - run: npx playwright install --with-deps chromium

      - id: e2e
        name: Run guest Gold Day 1 journey
        continue-on-error: true
        run: npx playwright test e2e/gold-day-one.spec.ts --project=chromium

      - name: Record result on branch
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p tmp
          {
            echo "outcome=${E2E_OUTCOME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > tmp/gold-day-one-e2e-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/gold-day-one-e2e-result.txt
          git commit -m "Record Gold Day 1 E2E result [skip ci]" || true
          git push origin HEAD:agent/gold-day-one

      - name: Fail when journey failed
        if: steps.e2e.outcome != 'success'
        run: exit 1
