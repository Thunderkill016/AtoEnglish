name: Gold Day 1 E2E

on:
  push:
    branches: [agent/gold-day-one]
    paths-ignore:
      - tmp/gold-day-one-e2e-result.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guest-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-day-one

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --prefer-offline
      - run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/gold-day-one-dev.log 2>&1 &
          echo $! > /tmp/gold-day-one-dev.pid
          npx wait-on http://127.0.0.1:3000/learn/unit-a0-1 --timeout 120000

      - id: e2e
        name: Run guest Gold Day 1 journey
        continue-on-error: true
        run: npx playwright test e2e/gold-day-one.spec.ts --project=chromium

      - name: Record result on branch
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p tmp
          {
            echo "outcome=${E2E_OUTCOME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            if [ "${E2E_OUTCOME}" != "success" ]; then
              echo "--- server log ---"
              tail -n 120 /tmp/gold-day-one-dev.log || true
            fi
          } > tmp/gold-day-one-e2e-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/gold-day-one-e2e-result.txt
          git commit -m "Record Gold Day 1 E2E result [skip ci]" || true
          git push origin HEAD:agent/gold-day-one

      - name: Fail when journey failed
        if: steps.e2e.outcome != 'success'
        run: exit 1
