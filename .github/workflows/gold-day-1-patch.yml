name: Apply Gold Day 1 metadata patch

on:
  push:
    branches:
      - agent/gold-day-1-cefr
    paths:
      - .github/workflows/gold-day-1-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply Gold Day 1 metadata patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gold-day-1-cefr
          fetch-depth: 0

      - name: Apply bounded metadata fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "src/lib/constants/units.ts",
              '''  {
              id: "unit-a0-1",
              title: "Unit A0-1: Bảng Chữ Cái & Âm Cơ Bản",
              description: "Học 26 chữ cái tiếng Anh và cách phát âm cơ bản — nền tảng đầu tiên của hành trình học tiếng Anh.",
              level: "A0",
              route: "/learn/unit-a0-1",
              xp: 60,
              estimatedTime: 45,
              tags: ["Từ vựng +10", "Bảng chữ cái", "My name is"],
            },''',
              '''  {
              id: "unit-a0-1",
              title: "Day 1: Nói tên và đánh vần",
              description: "Chào, nói tên, đánh vần tên và xin người đối diện nói lại trong một tình huống công việc ngắn.",
              level: "A0",
              route: "/learn/unit-a0-1",
              xp: 30,
              estimatedTime: 15,
              tags: ["Luyện nói", "Tên & đánh vần", "Communication repair"],
            },''',
          )

          replace_exact(
              "src/app/(main)/learn/[unitSlug]/page.tsx",
              'import { UNITS } from "@/lib/constants/units";\n',
              '',
          )
          replace_exact(
              "src/app/(main)/learn/[unitSlug]/page.tsx",
              '''  const meta = UNITS.find((u) => u.id === unitSlug);
            if (!meta) return { title: "Bài học không tìm thấy" };

            return {
              title: meta.title,
              description: meta.description,
              robots: { index: false }, // Protected page — no public indexing
            };''',
              '''  const entry = UNIT_DATA_MAP[unitSlug];
            if (!entry) return { title: "Bài học không tìm thấy" };

            return {
              title: entry.data.title,
              description: entry.data.description,
              robots: { index: false }, // Protected page — no public indexing
            };''',
          )

          replace_exact(
              "src/components/learn/lesson-ui/HowToLearnCard.tsx",
              '''import {
            LESSON_BLUEPRINT,
            REFERENCE_UNIT_ID,
            type ContentBlockId,
          } from "@/lib/lessons/lesson-blueprint";''',
              '''import {
            LESSON_BLUEPRINT,
            type ContentBlockId,
          } from "@/lib/lessons/lesson-blueprint";''',
          )
          replace_exact(
              "src/components/learn/lesson-ui/HowToLearnCard.tsx",
              '        Cách học 1 bài (~30 phút)',
              '        Cách học một bài',
          )
          replace_exact(
              "src/components/learn/lesson-ui/HowToLearnCard.tsx",
              '        Cùng khung với nội dung — tham chiếu {REFERENCE_UNIT_ID} (SDL + IPOR)',
              '        Đi theo 4 pha: tiếp nhận → xử lý → sản xuất → ôn tập.',
          )
          PY

      - name: Commit final source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gold-day-1-patch.yml
          git add src/lib/constants/units.ts \
            'src/app/(main)/learn/[unitSlug]/page.tsx' \
            src/components/learn/lesson-ui/HowToLearnCard.tsx
          git commit -m "fix: align Gold Day 1 metadata and learner guidance"
          git push origin HEAD:agent/gold-day-1-cefr
