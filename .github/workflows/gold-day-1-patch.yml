name: Apply Gold Day 1 metadata patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/gold-day-1-cefr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gold-day-1-cefr
          fetch-depth: 0

      - name: Apply bounded metadata fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          units = "src/lib/constants/units.ts"
          replace_exact(units, '    title: "Unit A0-1: Bảng Chữ Cái & Âm Cơ Bản",', '    title: "Day 1: Nói tên và đánh vần",')
          replace_exact(units, '    description: "Học 26 chữ cái tiếng Anh và cách phát âm cơ bản — nền tảng đầu tiên của hành trình học tiếng Anh.",', '    description: "Chào, nói tên, đánh vần tên và xin người đối diện nói lại trong một tình huống công việc ngắn.",')
          replace_exact(units, '    xp: 60,\n    estimatedTime: 45,\n    tags: ["Từ vựng +10", "Bảng chữ cái", "My name is"],', '    xp: 30,\n    estimatedTime: 15,\n    tags: ["Luyện nói", "Tên & đánh vần", "Communication repair"],')

          route = "src/app/(main)/learn/[unitSlug]/page.tsx"
          replace_exact(route, 'import { UNITS } from "@/lib/constants/units";\n', '')
          replace_exact(route, '  const meta = UNITS.find((u) => u.id === unitSlug);\n  if (!meta) return { title: "Bài học không tìm thấy" };', '  const entry = UNIT_DATA_MAP[unitSlug];\n  if (!entry) return { title: "Bài học không tìm thấy" };')
          replace_exact(route, '    title: meta.title,\n    description: meta.description,', '    title: entry.data.title,\n    description: entry.data.description,')

          guide = "src/components/learn/lesson-ui/HowToLearnCard.tsx"
          replace_exact(guide, '  REFERENCE_UNIT_ID,\n', '')
          replace_exact(guide, '        Cách học 1 bài (~30 phút)', '        Cách học một bài')
          replace_exact(guide, '        Cùng khung với nội dung — tham chiếu {REFERENCE_UNIT_ID} (SDL + IPOR)', '        Đi theo 4 pha: tiếp nhận → xử lý → sản xuất → ôn tập.')
          PY

      - name: Commit final source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gold-day-1-patch.yml
          git add src/lib/constants/units.ts \
            'src/app/(main)/learn/[unitSlug]/page.tsx' \
            src/components/learn/lesson-ui/HowToLearnCard.tsx
          git commit -m "fix: align Gold Day 1 metadata and learner guidance"
          git push origin HEAD:agent/gold-day-1-cefr
