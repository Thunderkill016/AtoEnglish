name: Spec 001 T061 Stage Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Write hosted integration harness
        shell: python
        run: |
          import base64
          from pathlib import Path
          encoded = "     bmAsCiAgICAgICJ1dGY4IiwKICAgICk7CiAgfSk7Cn0pOwo="
          content = base64.b64decode(encoded.replace(" ", "")).decode()
          Path("src/__tests__/integration/real-talk-transcript-review-hosted.integration.test.ts").write_text(content)

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Verify staged harness
        run: |
          npm run lint
          npx tsc --noEmit
          npm run test:real-talk

      - name: Commit staged harness
        shell: bash
        run: |
          rm .github/workflows/spec001-t061-stage-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(spec001): stage hosted transcript review harness"
          git push origin HEAD:agent/rebuild-learning-core
