name: Run pilot analytics validator once

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: run pilot analytics validator') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/pilot-analytics')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout analytics branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/pilot-analytics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply, validate, and publish branch result
        shell: bash
        run: |
          set +e
          LOG=/tmp/pilot-analytics-validation.log
          FAILED=0
          exec > >(tee -a "$LOG") 2>&1

          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path(".github/workflows/pilot-analytics.yml").read_text(encoding="utf-8")
          start_marker = "          PATCH_B64'\n"
          end_marker = "\n          PATCH_B64"
          start = payload.index(start_marker) + len(start_marker)
          end = payload.index(end_marker, start)
          encoded = "".join(line.strip() for line in payload[start:end].splitlines())
          Path("/tmp/apply_patch.py").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          if [ $? -ne 0 ]; then FAILED=1; fi

          if [ "$FAILED" -eq 0 ]; then
            python /tmp/apply_patch.py
            if [ $? -ne 0 ]; then FAILED=1; fi
          fi

          if [ "$FAILED" -eq 0 ]; then
            python - <<'PY'
          from pathlib import Path

          path = Path("src/app/actions/pilot-analytics.ts")
          text = path.read_text(encoding="utf-8")
          old_guard = '''  const event = parsed.data;
          if (!event.anonymousId) return { success: false };
          '''
          new_guard = '''  const event = parsed.data;
          const anonymousId = event.anonymousId;
          if (!anonymousId) return { success: false };
          '''
          if text.count(old_guard) != 1:
              raise SystemExit("Expected the anonymous-id guard exactly once")
          text = text.replace(old_guard, new_guard, 1)
          old_insert = "    anonymous_id: event.anonymousId,\n"
          if text.count(old_insert) != 1:
              raise SystemExit("Expected the anonymous-id insert exactly once")
          text = text.replace(old_insert, "    anonymous_id: anonymousId,\n", 1)
          path.write_text(text, encoding="utf-8")
          PY
            if [ $? -ne 0 ]; then FAILED=1; fi
          fi

          gate() {
            if [ "$FAILED" -eq 0 ]; then
              "$@"
              if [ $? -ne 0 ]; then FAILED=1; fi
            fi
          }

          gate git diff --check
          gate npm ci --ignore-scripts --legacy-peer-deps
          gate npx playwright install --with-deps chromium
          gate npx vitest run src/lib/pilot/pilot-analytics.test.ts src/lib/pilot/pilot-analytics-client.test.ts src/components/learn/UnitTemplate.test.tsx
          gate npx tsc --noEmit
          gate npx eslint src/lib/pilot/pilot-analytics.ts src/lib/pilot/pilot-analytics.test.ts src/lib/pilot/pilot-analytics-client.ts src/lib/pilot/pilot-analytics-client.test.ts src/app/actions/pilot-analytics.ts src/components/analytics/PilotLifecycleTracker.tsx src/components/landing/HeroCTA.tsx src/components/landing/FinalCtaSection.tsx src/components/learn/UnitTemplate.tsx src/components/learn/sections/SpeakingSection.tsx src/app/layout.tsx
          gate npm run lint
          gate npm run test
          gate npm run test:content-standard
          gate npm run build

          if [ "$FAILED" -eq 0 ]; then
            npm run start -- -H 127.0.0.1 > /tmp/atoenglish-server.log 2>&1 &
            SERVER_PID=$!
            npx wait-on http://127.0.0.1:3000 --timeout 60000
            if [ $? -eq 0 ]; then
              PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/lesson-smoke.spec.ts
              if [ $? -ne 0 ]; then FAILED=1; fi
            else
              FAILED=1
            fi
            kill "$SERVER_PID" 2>/dev/null || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$FAILED" -eq 0 ]; then
            git rm -f .github/workflows/pilot-analytics.yml .pilot-analytics-trigger scripts/pilot-analytics-payload.yml scripts/trigger-pilot-analytics-validator.txt
            rm -f reports/pilot-analytics-validation-failure.txt
            git add -A
            git commit -m "feat: add minimal pilot analytics"
          else
            git reset --hard HEAD
            mkdir -p reports
            {
              echo "Pilot analytics validation failed."
              echo
              echo "Last 200 log lines:"
              echo '```text'
              tail -n 200 "$LOG"
              echo '```'
            } > reports/pilot-analytics-validation-failure.txt
            git add reports/pilot-analytics-validation-failure.txt
            git commit -m "ci: record pilot analytics validation failure"
          fi

          git push origin HEAD:agent/pilot-analytics
          echo "$FAILED" > /tmp/pilot-analytics-status
          exit 0

      - name: Remove one-time validator from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pilot-analytics-main-validator.yml
          git commit -m "chore: remove one-time pilot analytics validator"
          git push origin main

      - name: Fail workflow when validation failed
        if: always()
        shell: bash
        run: |
          test "$(cat /tmp/pilot-analytics-status 2>/dev/null || echo 1)" = "0"
