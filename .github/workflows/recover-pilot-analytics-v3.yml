name: Recover pilot analytics v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: recover-pilot-analytics-v3
  cancel-in-progress: true

jobs:
  recover:
    if: github.head_ref == 'agent/pilot-analytics'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/pilot-analytics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Recover, validate, and commit analytics
        shell: bash
        run: |
          set +e
          LOG=/tmp/pilot-analytics-recovery.log
          FAILED=0
          exec > >(tee -a "$LOG") 2>&1

          git fetch origin 2f8f1107fb3d5c3879edd3f22e7dcf35e29f393f --depth=1
          git show 2f8f1107fb3d5c3879edd3f22e7dcf35e29f393f:.github/workflows/pilot-analytics.yml > /tmp/pilot-analytics-payload.yml
          if [ $? -ne 0 ]; then FAILED=1; fi

          if [ "$FAILED" -eq 0 ]; then
            python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path('/tmp/pilot-analytics-payload.yml').read_text(encoding='utf-8')
          lines = payload.splitlines()
          start = next(i for i, line in enumerate(lines) if "<<'PATCH_B64'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PATCH_B64')
          encoded = ''.join(line.strip() for line in lines[start:end])
          Path('/tmp/apply_patch.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
            if [ $? -ne 0 ]; then FAILED=1; fi
          fi

          if [ "$FAILED" -eq 0 ]; then
            python /tmp/apply_patch.py
            if [ $? -ne 0 ]; then FAILED=1; fi
          fi

          if [ "$FAILED" -eq 0 ]; then
            python - <<'PY'
          from pathlib import Path

          path = Path('src/app/actions/pilot-analytics.ts')
          text = path.read_text(encoding='utf-8')
          old_guard = "  const event = parsed.data;\n  if (!event.anonymousId) return { success: false };\n"
          new_guard = "  const event = parsed.data;\n  const anonymousId = event.anonymousId;\n  if (!anonymousId) return { success: false };\n"
          if text.count(old_guard) != 1:
              raise SystemExit('Expected the anonymous-id guard exactly once')
          text = text.replace(old_guard, new_guard, 1)
          old_insert = "    anonymous_id: event.anonymousId,\n"
          if text.count(old_insert) != 1:
              raise SystemExit('Expected the anonymous-id insert exactly once')
          text = text.replace(old_insert, "    anonymous_id: anonymousId,\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
            if [ $? -ne 0 ]; then FAILED=1; fi
          fi

          gate() {
            if [ "$FAILED" -eq 0 ]; then
              "$@"
              if [ $? -ne 0 ]; then FAILED=1; fi
            fi
          }

          gate git diff --check
          gate npm ci --ignore-scripts --legacy-peer-deps
          gate npx vitest run src/lib/pilot/pilot-analytics.test.ts src/lib/pilot/pilot-analytics-client.test.ts src/components/learn/UnitTemplate.test.tsx
          gate npx tsc --noEmit
          gate npx eslint src/lib/pilot/pilot-analytics.ts src/lib/pilot/pilot-analytics.test.ts src/lib/pilot/pilot-analytics-client.ts src/lib/pilot/pilot-analytics-client.test.ts src/app/actions/pilot-analytics.ts src/components/analytics/PilotLifecycleTracker.tsx src/components/landing/HeroCTA.tsx src/components/landing/FinalCtaSection.tsx src/components/learn/UnitTemplate.tsx src/components/learn/sections/SpeakingSection.tsx src/app/layout.tsx
          gate npm run lint
          gate npm run test
          gate npm run test:content-standard
          gate npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$FAILED" -eq 0 ]; then
            rm -f .github/workflows/pilot-analytics.yml .pilot-analytics-trigger reports/pilot-analytics-validation-failure.txt
            git add -A
            git commit -m "feat: add minimal pilot analytics"
          else
            git reset --hard HEAD
            mkdir -p reports
            {
              echo 'Pilot analytics validation failed.'
              echo
              echo 'Last 250 log lines:'
              echo '```text'
              tail -n 250 "$LOG"
              echo '```'
            } > reports/pilot-analytics-validation-failure.txt
            git add reports/pilot-analytics-validation-failure.txt
            git commit -m "ci: record pilot analytics validation failure" || true
          fi

          git push origin HEAD:agent/pilot-analytics
          exit "$FAILED"
