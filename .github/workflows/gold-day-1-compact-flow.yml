name: Build and validate compact Gold Day 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compact-flow:
    if: github.head_ref == 'agent/gold-day-1-cefr'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gold-day-1-cefr
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compact lesson flow
        shell: bash
        run: |
          if grep -q 'GOLD_DAY_1_SECTION_ORDER' src/components/learn/lesson-sections.ts; then
            echo 'Compact flow already applied.'
            exit 0
          fi

          cat > src/components/learn/lesson-sections.ts <<'EOF'
          export const SECTION_LABELS: Record<number, string> = {
            1: "Khởi động",
            2: "Cụm nói",
            3: "Ngữ pháp",
            4: "Luyện tập",
            5: "Hội thoại",
            10: "Phản xạ",
            9: "Dịch câu",
            6: "Shadowing",
            7: "Luyện nói",
            8: "Hoàn thành",
          };

          export const SECTION_ORDER = [1, 2, 3, 4, 5, 10, 9, 6, 7, 8] as const;
          export const GOLD_DAY_1_SECTION_ORDER = [1, 2, 5, 4, 6, 7, 8] as const;

          export type SectionNumber = (typeof SECTION_ORDER)[number];
          export type LessonSectionOrder = readonly SectionNumber[];

          export const TOTAL_SECTIONS = SECTION_ORDER.length;

          export function getSectionOrder(unitId: string): LessonSectionOrder {
            return unitId === "unit-a0-1" ? GOLD_DAY_1_SECTION_ORDER : SECTION_ORDER;
          }
          EOF

          cat > src/components/learn/lesson-ui/LessonProgress.tsx <<'EOF'
          import {
            SECTION_ORDER,
            type LessonSectionOrder,
          } from "../lesson-sections";

          interface LessonProgressProps {
            sectionOrderIdx: number;
            sectionOrder?: LessonSectionOrder;
          }

          export default function LessonProgress({
            sectionOrderIdx,
            sectionOrder = SECTION_ORDER,
          }: LessonProgressProps) {
            const totalSections = sectionOrder.length;
            const progress = Math.round(
              (sectionOrderIdx / Math.max(totalSections - 1, 1)) * 100,
            );

            return (
              <div
                className="flex items-center gap-0 mt-2"
                role="progressbar"
                aria-valuenow={progress}
                aria-valuemin={0}
                aria-valuemax={100}
                aria-label={`Tiến độ bài học: bước ${sectionOrderIdx + 1} / ${totalSections}`}
              >
                {sectionOrder.map((secNum, index) => {
                  const isSectionCompleted = index < sectionOrderIdx;
                  const isSectionCurrent = index === sectionOrderIdx;

                  return (
                    <div key={secNum} className="flex items-center flex-1 min-w-0">
                      <div
                        className={`relative flex items-center justify-center rounded-full shrink-0 transition-all duration-300 ${
                          isSectionCurrent
                            ? "w-7 h-7 bg-emerald-500 ring-2 ring-emerald-400/50 ring-offset-1 ring-offset-zinc-950 shadow-lg shadow-emerald-900/60"
                            : isSectionCompleted
                              ? "w-5 h-5 bg-emerald-800"
                              : "w-5 h-5 bg-zinc-800"
                        }`}
                      >
                        {isSectionCompleted ? (
                          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                            <path
                              d="M2 5l2 2 4-4"
                              stroke="#34d399"
                              strokeWidth="1.5"
                              strokeLinecap="round"
                              strokeLinejoin="round"
                            />
                          </svg>
                        ) : (
                          <span
                            className={`font-bold tabular-nums leading-none select-none ${
                              isSectionCurrent
                                ? "text-white text-[11px]"
                                : "text-zinc-600 text-[9px]"
                            }`}
                          >
                            {index + 1}
                          </span>
                        )}
                        {isSectionCurrent && (
                          <span className="absolute inset-0 rounded-full bg-emerald-400/20 animate-ping" />
                        )}
                      </div>
                      {index < sectionOrder.length - 1 && (
                        <div
                          className={`h-px flex-1 mx-0.5 transition-all duration-500 ${
                            index < sectionOrderIdx ? "bg-emerald-700" : "bg-zinc-800"
                          }`}
                        />
                      )}
                    </div>
                  );
                })}
              </div>
            );
          }
          EOF

          cat > src/components/learn/hooks/useLessonProgress.ts <<'EOF'
          "use client";

          import { useEffect, type Dispatch, type SetStateAction } from "react";

          import {
            SECTION_ORDER,
            type LessonSectionOrder,
            type SectionNumber,
          } from "../lesson-sections";

          interface UseLessonProgressOptions {
            unitId: string;
            section: number;
            setSection: Dispatch<SetStateAction<number>>;
            sectionOrder?: LessonSectionOrder;
          }

          const getProgressKey = (unitId: string) => `lesson-progress-${unitId}`;

          export default function useLessonProgress({
            unitId,
            section,
            setSection,
            sectionOrder = SECTION_ORDER,
          }: UseLessonProgressOptions) {
            useEffect(() => {
              try {
                const saved = localStorage.getItem(getProgressKey(unitId));
                if (saved) {
                  const { section: savedSection } = JSON.parse(saved) as { section: number };
                  const savedIndex = sectionOrder.indexOf(savedSection as SectionNumber);

                  if (savedIndex > 0 && savedIndex < sectionOrder.length - 1) {
                    setSection(savedSection);
                  }
                }
              } catch {
                // Preserve the existing non-fatal behavior for malformed browser storage.
              }
            }, [sectionOrder, setSection, unitId]);

            useEffect(() => {
              const orderIdx = sectionOrder.indexOf(section as SectionNumber);
              const isFirstSection = orderIdx === 0;
              const isLastSection = orderIdx === sectionOrder.length - 1;
              const progressKey = getProgressKey(unitId);

              if (isLastSection) {
                localStorage.removeItem(progressKey);
              } else if (!isFirstSection && orderIdx > 0) {
                localStorage.setItem(progressKey, JSON.stringify({ section }));
              }
            }, [section, sectionOrder, unitId]);
          }
          EOF

          cat > src/components/learn/lesson-ui/HowToLearnCard.tsx <<'EOF'
          import {
            LESSON_BLUEPRINT,
            type ContentBlockId,
          } from "@/lib/lessons/lesson-blueprint";
          import { IPOR_META, type IporPhase } from "@/lib/lessons/learning-flow";

          const IPOR_PHASES: IporPhase[] = ["input", "processing", "output", "review"];

          const FULL_STEPS = IPOR_PHASES.map((phase) => {
            const blocks = LESSON_BLUEPRINT.filter(
              (block) => block.phase === phase && block.sectionIds.length > 0,
            );
            const labels: Record<ContentBlockId, string> = {
              meta: "",
              hook: "tình huống",
              warmup: "ôn SRS",
              vocab: "từ vựng",
              grammar: "ngữ pháp",
              exercises_input: "luyện tập",
              dialogues: "hội thoại",
              fluency: "phản xạ",
              output: "dịch → shadowing → nói",
              review: "quiz + ôn tích lũy",
            };
            const text = blocks.map((block) => labels[block.id]).filter(Boolean).join(" → ");
            return { phase, text };
          });

          const GOLD_DAY_1_STEPS: Array<{ phase: IporPhase; text: string }> = [
            { phase: "input", text: "tình huống → cụm nói → hội thoại" },
            { phase: "processing", text: "nghe chọn → trả lời nhanh" },
            { phase: "output", text: "shadowing → tự nói" },
            { phase: "review", text: "quiz ngắn" },
          ];

          interface HowToLearnCardProps {
            compact?: boolean;
          }

          export default function HowToLearnCard({ compact = false }: HowToLearnCardProps) {
            const steps = compact ? GOLD_DAY_1_STEPS : FULL_STEPS;

            return (
              <div className="mb-6 rounded-2xl border border-zinc-800/80 bg-zinc-900/60 p-4">
                <p className="text-[11px] font-black text-zinc-500 uppercase tracking-wider mb-1">
                  Cách học một bài
                </p>
                <p className="text-[10px] text-zinc-600 mb-3">
                  {compact
                    ? "Bảy bước ngắn, ưu tiên nghe và nói ngay."
                    : "Đi theo 4 pha: tiếp nhận → xử lý → sản xuất → ôn tập."}
                </p>
                <ol className="space-y-2.5">
                  {steps.map(({ phase, text }, index) => (
                    <li key={phase} className="flex items-start gap-3 text-sm">
                      <span className="flex size-6 shrink-0 items-center justify-center rounded-lg bg-zinc-800 text-[11px] font-black text-zinc-400">
                        {index + 1}
                      </span>
                      <div>
                        <span className="text-[10px] font-bold text-zinc-600">
                          {IPOR_META[phase].labelVi}
                        </span>
                        <p className="text-zinc-300 leading-snug">{text}</p>
                      </div>
                    </li>
                  ))}
                </ol>
                <p className="mt-3 text-[11px] text-zinc-600 border-t border-zinc-800/80 pt-3">
                  Ôn nhanh chỉ dùng khi đã học bài này ít nhất 1 lần.
                </p>
              </div>
            );
          }
          EOF

          cat > src/__tests__/lesson-section-order.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import {
            GOLD_DAY_1_SECTION_ORDER,
            SECTION_ORDER,
            getSectionOrder,
          } from "@/components/learn/lesson-sections";

          describe("lesson section order", () => {
            it("keeps Gold Day 1 as a focused seven-step speaking journey", () => {
              expect(getSectionOrder("unit-a0-1")).toBe(GOLD_DAY_1_SECTION_ORDER);
              expect([...GOLD_DAY_1_SECTION_ORDER]).toEqual([1, 2, 5, 4, 6, 7, 8]);
              expect(GOLD_DAY_1_SECTION_ORDER).not.toContain(3);
              expect(GOLD_DAY_1_SECTION_ORDER).not.toContain(9);
              expect(GOLD_DAY_1_SECTION_ORDER).not.toContain(10);
            });

            it("preserves the legacy section order for every other unit", () => {
              expect(getSectionOrder("unit-a0-2")).toBe(SECTION_ORDER);
              expect(getSectionOrder("unit-1")).toBe(SECTION_ORDER);
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          def require_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          warmup = Path("src/components/learn/sections/WarmupSection.tsx")
          warmup_text = warmup.read_text(encoding="utf-8")
          warmup_text = require_replace(
              warmup_text,
              "<HowToLearnCard />",
              '<HowToLearnCard compact={unit.unitId === "unit-a0-1"} />',
              "warmup compact card",
          )
          warmup.write_text(warmup_text, encoding="utf-8")

          unit_template = Path("src/components/learn/UnitTemplate.tsx")
          text = unit_template.read_text(encoding="utf-8")
          text = require_replace(text, "  SECTION_ORDER,\n  TOTAL_SECTIONS,\n", "  getSectionOrder,\n", "section imports")
          text = require_replace(
              text,
              "  };\n\n  const VOCAB_LIMIT = normalizedUnit.vocab.length;",
              '  };\n  const activeSectionOrder = getSectionOrder(normalizedUnit.unitId);\n  const totalSections = activeSectionOrder.length;\n  const isGoldDay1 = normalizedUnit.unitId === "unit-a0-1";\n\n  const VOCAB_LIMIT = normalizedUnit.vocab.length;',
              "active section order",
          )
          text = require_replace(text, "  setSection,\n});", "  setSection,\n  sectionOrder: activeSectionOrder,\n});", "progress hook order")
          text = require_replace(text, "if (miniSession && section === 4)", "if (!isGoldDay1 && miniSession && section === 4)", "mini session guard")
          text = require_replace(text, "if (section === 4 && !sessionBreak)", "if (!isGoldDay1 && section === 4 && !sessionBreak)", "session break guard")
          text = require_replace(
              text,
              "const idx = SECTION_ORDER.indexOf(section as SectionNumber);\n    const nextSection = SECTION_ORDER[Math.min(idx + 1, SECTION_ORDER.length - 1)];",
              "const idx = activeSectionOrder.indexOf(section as SectionNumber);\n    const nextSection = activeSectionOrder[Math.min(idx + 1, activeSectionOrder.length - 1)];",
              "next section order",
          )
          text = require_replace(text, "const sectionOrderIdx = SECTION_ORDER.indexOf(section as SectionNumber);", "const sectionOrderIdx = activeSectionOrder.indexOf(section as SectionNumber);", "section index")
          text = require_replace(text, "{miniSession ? (", "{!isGoldDay1 && miniSession ? (", "hide active mini session")
          text = require_replace(text, ") : section < 8 && (", ") : !isGoldDay1 && section < 8 && (", "hide mini session button")
          text = require_replace(text, "{sectionOrderIdx + 1}/{TOTAL_SECTIONS}", "{sectionOrderIdx + 1}/{totalSections}", "header section total")
          text = require_replace(text, "<LessonProgress sectionOrderIdx={sectionOrderIdx} />", "<LessonProgress sectionOrderIdx={sectionOrderIdx} sectionOrder={activeSectionOrder} />", "dynamic progress bar")
          if "TOTAL_SECTIONS={TOTAL_SECTIONS}" not in text:
              raise SystemExit("Missing section component totals")
          text = text.replace("TOTAL_SECTIONS={TOTAL_SECTIONS}", "TOTAL_SECTIONS={totalSections}")
          unit_template.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate lesson content
        run: npm run test:content-standard

      - name: Test compact section order
        run: npx vitest run src/__tests__/lesson-section-order.test.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint changed source
        run: npx eslint src/components/learn/UnitTemplate.tsx src/components/learn/lesson-sections.ts src/components/learn/lesson-ui/LessonProgress.tsx src/components/learn/hooks/useLessonProgress.ts src/components/learn/lesson-ui/HowToLearnCard.tsx src/components/learn/sections/WarmupSection.tsx src/__tests__/lesson-section-order.test.ts

      - name: Production build
        run: npm run build

      - name: Publish validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/learn/UnitTemplate.tsx \
            src/components/learn/lesson-sections.ts \
            src/components/learn/lesson-ui/LessonProgress.tsx \
            src/components/learn/hooks/useLessonProgress.ts \
            src/components/learn/lesson-ui/HowToLearnCard.tsx \
            src/components/learn/sections/WarmupSection.tsx \
            src/__tests__/lesson-section-order.test.ts
          if git diff --cached --quiet; then
            echo 'Validated source already published.'
            exit 0
          fi
          git commit -m "feat: give Gold Day 1 a focused seven-step flow"
          git push origin HEAD:agent/gold-day-1-cefr
