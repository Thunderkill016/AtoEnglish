name: Spec 001 T074 Persisted Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  persisted-preview:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      HUSKY: 0
      SPEC001_T074_BROKER_URL: https://zpiwddskhduuykpxltun.supabase.co/functions/v1/spec001-t074-preview-session
      SPEC001_T074_OIDC_AUDIENCE: atoenglish-spec001-t074

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --prefer-offline

      - name: Acquire bounded hosted session
        shell: bash
        run: |
          set -euo pipefail
          separator='&'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" != *'?'* ]]; then
            separator='?'
          fi
          oidc_json=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${SPEC001_T074_OIDC_AUDIENCE}")
          oidc_token=$(OIDC_JSON="$oidc_json" node -e '
            const token = JSON.parse(process.env.OIDC_JSON || "{}").value;
            if (!token) process.exit(1);
            process.stdout.write(token);
          ')
          status=$(curl -sS \
            -o "$RUNNER_TEMP/spec001-t074-session.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H 'content-type: application/json' \
            --data '{"action":"create"}' \
            "$SPEC001_T074_BROKER_URL")
          if [[ "$status" != '200' ]]; then
            SESSION_FILE="$RUNNER_TEMP/spec001-t074-session.json" node -e '
              const fs = require("node:fs");
              const body = JSON.parse(fs.readFileSync(process.env.SESSION_FILE, "utf8"));
              console.error(`Broker rejected session creation: ${body.error || "unknown"}`);
            '
            exit 1
          fi

          SESSION_FILE="$RUNNER_TEMP/spec001-t074-session.json" node <<'NODE'
          const fs = require('node:fs');
          const session = JSON.parse(fs.readFileSync(process.env.SESSION_FILE, 'utf8'));
          for (const key of ['id', 'email', 'password']) {
            if (!session.user?.[key]) throw new Error(`Missing user.${key}`);
            console.log(`::add-mask::${session.user[key]}`);
          }
          if (!session.supabaseUrl || !session.publishableKey) {
            throw new Error('Missing hosted project settings');
          }
          console.log(`::add-mask::${session.publishableKey}`);
          const values = {
            NEXT_PUBLIC_SUPABASE_URL: session.supabaseUrl,
            NEXT_PUBLIC_SUPABASE_ANON_KEY: session.publishableKey,
            SPEC001_SUPABASE_URL: session.supabaseUrl,
            SPEC001_SUPABASE_PUBLISHABLE_KEY: session.publishableKey,
            SPEC001_TEST_USER_ID: session.user.id,
            SPEC001_TEST_EMAIL: session.user.email,
            SPEC001_TEST_PASSWORD: session.user.password,
            E2E_TEST_EMAIL: session.user.email,
            E2E_TEST_PASSWORD: session.user.password,
            SPEC001_EVIDENCE_PATH: `${process.env.RUNNER_TEMP}/spec001-t074-seed-evidence.json`,
            PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000',
          };
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n') + '\n',
          );
          NODE

      - name: Seed one persisted private draft through the real server action
        run: |
          set -euo pipefail
          npx vitest run --config vitest.hosted-real-talk.config.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createClient } from '@supabase/supabase-js';

          const client = createClient(
            process.env.SPEC001_SUPABASE_URL,
            process.env.SPEC001_SUPABASE_PUBLISHABLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          );
          const { data: authData, error: authError } = await client.auth.signInWithPassword({
            email: process.env.SPEC001_TEST_EMAIL,
            password: process.env.SPEC001_TEST_PASSWORD,
          });
          if (authError || authData.user?.id !== process.env.SPEC001_TEST_USER_ID) {
            throw new Error('Could not establish owner session for slug lookup');
          }
          const { data: row, error } = await client
            .from('real_talk_videos')
            .select('slug')
            .eq('created_by', process.env.SPEC001_TEST_USER_ID)
            .eq('youtube_id', 'M7lc1UVf-VE')
            .single();
          if (error || !row?.slug) throw new Error('Persisted draft slug not found');
          fs.appendFileSync(process.env.GITHUB_ENV, `SPEC001_T074_SLUG=${row.slug}\n`);
          await client.auth.signOut();
          NODE

      - name: Build application without deployment
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > "$RUNNER_TEMP/spec001-t074-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spec001-t074-server.pid"
          npx wait-on --timeout 120000 http://127.0.0.1:3000/login

      - name: Run desktop and mobile persisted preview
        run: >-
          npx playwright test e2e/real-talk-persisted-draft.spec.ts
          --project=chromium --project="Mobile Chrome"

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/spec001-t074-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/spec001-t074-server.pid")" || true
          fi

      - name: Cleanup bounded hosted fixtures
        if: always() && env.SPEC001_TEST_USER_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          separator='&'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" != *'?'* ]]; then
            separator='?'
          fi
          oidc_json=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${SPEC001_T074_OIDC_AUDIENCE}")
          oidc_token=$(OIDC_JSON="$oidc_json" node -e '
            const token = JSON.parse(process.env.OIDC_JSON || "{}").value;
            if (!token) process.exit(1);
            process.stdout.write(token);
          ')
          status=$(curl -sS \
            -o "$RUNNER_TEMP/spec001-t074-cleanup.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H 'content-type: application/json' \
            --data "{\"action\":\"cleanup\",\"userId\":\"$SPEC001_TEST_USER_ID\"}" \
            "$SPEC001_T074_BROKER_URL")
          if [[ "$status" != '200' ]]; then
            exit 1
          fi
          CLEANUP_FILE="$RUNNER_TEMP/spec001-t074-cleanup.json" node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.env.CLEANUP_FILE, "utf8"));
            if (value.cleaned !== true || value.remainingVideos !== 0) process.exit(1);
          '

      - name: Upload T074 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec001-t074-persisted-preview-evidence
          if-no-files-found: warn
          path: |
            test-results
            ${{ runner.temp }}/spec001-t074-seed-evidence.json
            ${{ runner.temp }}/spec001-t074-cleanup.json
            ${{ runner.temp }}/spec001-t074-server.log
