name: Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Content standards
        run: npm run test:content-standard

      - name: OpenPronounce shadow service contract
        run: |
          python -m py_compile \
            services/openpronounce-shadow/app.py \
            services/openpronounce-shadow/provider_contract.py \
            services/openpronounce-shadow/test_provider_contract.py
          python services/openpronounce-shadow/test_provider_contract.py

      - name: Pronunciation calibration harness
        run: |
          python -m py_compile \
            services/openpronounce-shadow/calibration/evaluate.py \
            services/openpronounce-shadow/calibration/test_evaluate.py
          python services/openpronounce-shadow/calibration/test_evaluate.py
          python services/openpronounce-shadow/calibration/evaluate.py \
            services/openpronounce-shadow/calibration/example.synthetic.jsonl \
            --split test \
            --compact

  database:
    name: Fresh migrations, database lint, and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Start fresh local Postgres and apply all migrations
        run: supabase db start

      - name: Lint database functions and schema
        run: supabase db lint --local --level error --fail-on error

      - name: Run pgTAP database and RLS tests
        run: supabase test db --local
