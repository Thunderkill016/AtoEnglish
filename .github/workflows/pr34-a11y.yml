name: PR 34 accessibility smoke

on:
  push:
    branches:
      - agent/accessibility-smoke-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://atoenglish-kfffwzi5v-thunderkill016s-projects.vercel.app

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure preview URL
        run: printf 'PLAYWRIGHT_BASE_URL=%s\n' "$PLAYWRIGHT_BASE_URL" > .env.local

      - name: Run accessibility smoke
        run: npm run e2e:a11y
