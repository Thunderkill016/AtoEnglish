name: Validate pilot analytics smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-pilot-analytics-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.head_ref == 'agent/pilot-analytics-recovery-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout analytics branch
        uses: actions/checkout@v4
        with:
          ref: agent/pilot-analytics-recovery-v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Run production lesson smoke tests
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 > /tmp/atoenglish-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/lesson-smoke.spec.ts
