name: Stabilize toolchain

on:
  push:
    branches: [agent/stabilize-toolchain]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: stabilize-toolchain
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-toolchain
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Record toolchain contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.packageManager = 'npm@11.16.0';
          packageJson.engines = {
            node: '24.x',
            npm: '11.x'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          printf '24\n' > .nvmrc

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install from lockfile
        run: |
          rm -rf node_modules
          npm ci --no-audit --prefer-offline

      - name: Explain dependency warnings
        shell: bash
        run: |
          npm explain request || true
          npm explain har-validator || true
          npm explain uuid || true
          npm explain @sentry/server-utils || true

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Content standards
        run: npm run test:content-standard

      - name: Production build
        run: npm run build

      - name: Commit reproducible toolchain
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .nvmrc
          git diff --cached --check
          git commit -m 'Stabilize Node and npm toolchain'
          git push origin HEAD:agent/stabilize-toolchain
