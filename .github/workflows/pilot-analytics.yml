name: Validate pilot analytics batch

on:
  push:
    branches:
      - agent/pilot-analytics
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pilot-analytics-batch
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/pilot-analytics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused analytics patch
        shell: bash
        run: |
          cat > /tmp/pilot-analytics-patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/pilot-analytics-patch.gz.b64 | gzip -d > /tmp/apply_patch.py
          python /tmp/apply_patch.py
          git diff --check

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused tests
        run: >-
          npx vitest run
          src/lib/pilot/pilot-analytics.test.ts
          src/lib/pilot/pilot-analytics-client.test.ts
          src/components/learn/UnitTemplate.test.tsx

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/pilot-analytics-typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-analytics-typecheck
          path: /tmp/pilot-analytics-typecheck.log
          if-no-files-found: error

      - name: Lint focused files
        run: >-
          npx eslint
          src/lib/pilot/pilot-analytics.ts
          src/lib/pilot/pilot-analytics.test.ts
          src/lib/pilot/pilot-analytics-client.ts
          src/lib/pilot/pilot-analytics-client.test.ts
          src/app/actions/pilot-analytics.ts
          src/components/analytics/PilotLifecycleTracker.tsx
          src/components/landing/HeroCTA.tsx
          src/components/landing/FinalCtaSection.tsx
          src/components/learn/UnitTemplate.tsx
          src/components/learn/sections/SpeakingSection.tsx
          src/app/layout.tsx

      - name: Run full quality gates
        run: |
          npm run lint
          npm run test
          npm run test:content-standard
          npm run build

      - name: Run production lesson smoke tests
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 > /tmp/atoenglish-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000             npx playwright test e2e/lesson-smoke.spec.ts

      - name: Commit validated batch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pilot-analytics.yml
          git add -A
          git commit -m "feat: add minimal pilot analytics"
          git push origin HEAD:agent/pilot-analytics
