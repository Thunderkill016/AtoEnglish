name: Spec 001 T049 Types Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core
          fetch-depth: 0

      - name: Generate reconciled files
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/spec001-t049-types.yml').read_text()
          start = workflow.index('          from pathlib import Path\n')
          end = workflow.index('\n      - name: Commit regenerated snapshot', start)
          raw_program = workflow[start:end]
          program = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_program.splitlines()
          )
          program = program.replace(
              'Path(".github/workflows/spec001-t049-types.yml").unlink()',
              'pass',
          )
          exec(compile(program, '<t049-reconcile>', 'exec'))

          Path('.github/workflows/spec001-t049-types.yml').unlink()
          Path('.github/workflows/spec001-t049-artifact.yml').unlink()

      - name: Commit reconciled snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/supabase.ts src/types/app-database.ts \
            .github/workflows/spec001-t049-types.yml \
            .github/workflows/spec001-t049-artifact.yml
          git commit -m "chore(spec001): replace hosted Supabase type snapshot"
          git push origin HEAD:agent/rebuild-learning-core
