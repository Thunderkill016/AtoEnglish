name: Validate completion characterization pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: completion-tests-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build focused patch from the reviewed workflow recipe
        run: |
          python <<'PY'
          from pathlib import Path
          recipe = Path('.github/workflows/temporary-completion-tests.yml').read_text()
          start = recipe.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = recipe.index("\n          PY", start)
          lines = recipe[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/completion_patch.py').write_text(code + '\n')
          PY
          python /tmp/completion_patch.py
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' AGENT_BACKLOG.md AGENT_PLAN.md src/components/learn/UnitTemplate.test.tsx | sort)"
          git diff --exit-code -- src/components/learn/UnitTemplate.tsx src/app/actions/unit.ts
      - name: Clean install
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Targeted lesson tests
        run: npx vitest run src/components/learn/UnitTemplate.test.tsx src/components/learn/lesson-sections.test.ts src/components/learn/lesson-ui/lesson-presentation.test.tsx
      - name: Inventory
        run: npm run inventory -- --write
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Full lint
        run: npm run lint
      - name: Full unit tests
        run: npm run test
      - name: Content standard
        run: npm run test:content-standard
      - name: Production build
        run: npm run build
      - name: Lesson production smoke
        run: |
          npm run start > /tmp/atoenglish-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          npx playwright test e2e/lesson-smoke.spec.ts
      - name: Commit validated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/learn/UnitTemplate.test.tsx AGENT_PLAN.md AGENT_BACKLOG.md
          git commit -m "test: characterize UnitTemplate completion flow"
          git push origin HEAD:${{ github.head_ref }}
