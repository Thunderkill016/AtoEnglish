# Lighthouse — weekly only (mỗi push main tốn ~5–8 phút, không cần thiết)

name: Performance CI

on:
  schedule:
    - cron: "0 7 * * 0"  # Chủ nhật 07:00 UTC
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://atoenglish.vercel.app
            https://atoenglish.vercel.app/login
          budgetPath: ./.lighthouserc/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true