name: Validate login metadata fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inventory
        run: npm run inventory

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full lint
        run: npm run lint

      - name: Full unit tests
        run: npm run test

      - name: Lesson content standard
        run: npm run test:content-standard

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/atoenglish.log 2>&1 &
          echo $! > /tmp/atoenglish.pid
          npx wait-on http-get://127.0.0.1:3000/login --timeout 60000

      - name: Capture login HTML
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/login > /tmp/login.html
          grep -o '<title[^>]*>[^<]*</title>' /tmp/login.html || true

      - name: Protected-route production E2E
        run: |
          set +e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/protected-routes.spec.ts --project=chromium 2>&1 | tee /tmp/protected-routes.log
          echo "${PIPESTATUS[0]}" > /tmp/protected-routes.exit
          exit 0

      - name: Lesson production smoke E2E
        run: |
          set +e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/lesson-smoke.spec.ts 2>&1 | tee /tmp/lesson-smoke.log
          echo "${PIPESTATUS[0]}" > /tmp/lesson-smoke.exit
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-metadata-validation
          path: |
            /tmp/login.html
            /tmp/protected-routes.log
            /tmp/protected-routes.exit
            /tmp/lesson-smoke.log
            /tmp/lesson-smoke.exit
            /tmp/atoenglish.log

      - name: Enforce browser results
        run: |
          test "$(cat /tmp/protected-routes.exit)" = "0"
          test "$(cat /tmp/lesson-smoke.exit)" = "0"
