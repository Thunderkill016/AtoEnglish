name: Remove legacy gtts dependency

on:
  push:
    branches: [agent/remove-gtts-dependency]
  workflow_dispatch:

concurrency:
  group: remove-gtts-dependency
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-gtts-dependency
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Reject legacy dependency chain
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const forbidden = new Map([
            ['gtts', null],
            ['request', null],
            ['har-validator', null],
            ['uuid', '3.4.0'],
          ]);
          const found = [];
          for (const [path, metadata] of Object.entries(lock.packages ?? {})) {
            if (!metadata || path === '') continue;
            const name = metadata.name ?? path.split('node_modules/').at(-1);
            if (!forbidden.has(name)) continue;
            const forbiddenVersion = forbidden.get(name);
            if (forbiddenVersion === null || metadata.version === forbiddenVersion) {
              found.push(`${name}@${metadata.version ?? 'unknown'} (${path})`);
            }
          }
          if (found.length > 0) {
            throw new Error(`Legacy dependencies remain:\n${found.join('\n')}`);
          }
          console.log('Legacy gtts dependency chain is absent from package-lock.json');
          NODE

      - name: Install from lockfile
        run: |
          rm -rf node_modules
          npm ci --no-audit --prefer-offline

      - name: Check audio generator loads offline
        run: npm run audio:generate:list

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Content standards
        run: npm run test:content-standard

      - name: Production build
        run: npm run build

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git commit -m 'Remove legacy gtts dependency from lockfile'
          git push origin HEAD:agent/remove-gtts-dependency
