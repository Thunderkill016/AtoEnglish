name: Spec 001 Server Action Finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/rebuild-learning-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-learning-core
          fetch-depth: 0

      - name: Record T051 and T068 completion
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          tasks_path = Path("specs/001-private-natural-lesson-compiler/tasks.md")
          tasks = tasks_path.read_text()
          tasks = replace_exact(
              tasks,
              "- [ ] T051 [US3] Apply and verify the atomic private-draft RPC, then run repeated\n  generation, reload, and rollback behavior through the real server action and\n  hosted database",
              "- [x] T051 [US3] Apply and verify the atomic private-draft RPC, then run repeated\n  generation, reload, and rollback behavior through the real server action and\n  hosted database; `generateRealTalkLesson` ran with a controlled compiler and\n  real hosted Auth, rate-limit ordering, repository, RPC, RLS, reload mapping,\n  rollback, and cleanup; evidence is recorded in\n  `t051-t068-server-action-hosted-verification.md`",
              "T051",
          )
          tasks = replace_exact(
              tasks,
              "- [ ] T068 Run repeated generation twice through the real server action and prove\n  one video/lesson pair is updated rather than duplicated",
              "- [x] T068 Run repeated generation twice through the real server action and prove\n  one video/lesson pair is updated rather than duplicated; two calls retained\n  one video ID and lesson identity, updated v2 content, reloaded through\n  `fetchLessonBySlug`, and left no row after a controlled failed lesson write",
              "T068",
          )
          tasks = replace_exact(
              tasks,
              "Retention and history boundaries\nare resolved. The real server-action path remains open.",
              "Retention and history boundaries\nare resolved. The real server-action persistence, reload, repeat-identity,\nand rollback path is observed with a controlled compiler; production source\ningestion remains open.",
              "Phase 5 checkpoint",
          )
          tasks = replace_exact(
              tasks,
              "**Checkpoint**: Code and migration contracts remove the known two-write path.\nHosted transactional behavior remains unclaimed.",
              "**Checkpoint**: Code and migration contracts remove the known two-write path.\nHosted RPC behavior and the real server-action repeat, reload, rollback, and\ncleanup path are observed. Live provider and trusted source evidence remain\nseparate gates.",
              "Phase 5C checkpoint",
          )
          tasks = replace_exact(
              tasks,
              "Hosted provenance/RPC:  PASS; migrations applied and verified\nProduction adapter:     NOT IMPLEMENTED",
              "Hosted provenance/RPC:  PASS; migrations applied and verified\nReal server action:     PASS with controlled compiler + hosted Auth/RPC/RLS\nProduction adapter:     NOT IMPLEMENTED",
              "Current status",
          )
          tasks_path.write_text(tasks)

          convergence_path = Path("specs/001-private-natural-lesson-compiler/convergence-review.md")
          convergence = convergence_path.read_text()
          marker = "## 2026-08-03 real server-action hosted follow-up"
          followup = (
              "\n\n## 2026-08-03 real server-action hosted follow-up\n\n"
              "T051 and T068 are now observed through the exported Next.js server actions "
              "with a controlled compiler and real hosted Auth, repository, atomic RPC, "
              "RLS, reload mapping, rollback, and cleanup. Repeated generation retained "
              "one video/lesson identity; a controlled lesson failure left no video-only row.\n\n"
              "This closes the real persistence-process gap. It does not close live Gemini, "
              "production-approved transcript ingestion, persisted browser Playwright, or "
              "human review. The convergence decision remains **NOT CONVERGED** and the PR "
              "remains **DO NOT MERGE / DO NOT DEPLOY**.\n\n"
              "Detailed evidence: `t051-t068-server-action-hosted-verification.md`.\n"
          )
          if marker not in convergence:
              convergence_path.write_text(convergence + followup)

          Path(".github/workflows/spec001-server-action-hosted.yml").unlink()

      - name: Commit final evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(spec001): record hosted server-action verification"
          git push origin HEAD:agent/rebuild-learning-core
