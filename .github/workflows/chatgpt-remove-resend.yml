name: ChatGPT Remove Resend

on:
  push:
    branches:
      - "refactor/delete-orphan-retention-email"
    paths:
      - "scripts/chatgpt-remove-resend.mjs"
      - ".github/workflows/chatgpt-remove-resend.yml"

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    env:
      CI: true
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --prefer-offline
      - run: node scripts/chatgpt-remove-resend.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run test:content-standard
      - name: Commit verified cleanup
        run: |
          git config user.name "chatgpt-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(scope): remove orphan resend dependency"
          git push origin HEAD:${{ github.ref_name }}
